<html lang="fr">

    background: #0a0a1a;
    display: flex; flex-direction: column;

<body>
<canvas id="gameCanvas" width="1200" height="800"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const TRACK_W = 120;
const HALF_W  = TRACK_W / 2;

let currentCircuit;
function isOnTrack(x,y) { return currentCircuit.isOnTrack(x,y); }
function checkZone(car) { return currentCircuit.checkZone(car); }
function resetZones()   { currentCircuit.resetZones(); }
function drawTrack()    { ctx.drawImage(currentCircuit.trackCvs,0,0); }
function drawZones()    { currentCircuit.drawZonesLive(); }

// ════════════════════════════════════════════════════════════
//  KEYS
// ════════════════════════════════════════════════════════════
const keys = {};
const lastKeyTime = {};
const boostKeys = {};
window.addEventListener('keydown', e => {
    if (keys[e.code]) return;
    keys[e.code] = true;
    const now = performance.now();
    if (lastKeyTime[e.code] && now-lastKeyTime[e.code] < 300) boostKeys[e.code] = true;
    lastKeyTime[e.code] = now;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const TRAIL_COLORS = ['#ff0000','#ff7700','#ffff00','#00ff00','#00ccff','#aa00ff','#ff00aa'];

// ════════════════════════════════════════════════════════════
//  CAR  (human)
// ════════════════════════════════════════════════════════════
class Car {
    constructor(color, hi, controls, label) {
        this.color=color; this.hi=hi; this.controls=controls; this.label=label;
        this.startPos={x:0,y:0,angle:0};
        this.x=0; this.y=0; this.angle=0; this.speed=0;
        this.prevX=0; this.prevY=0; this.finished=false;
        this.boostTimer=0; this.boostFuel=3; this.trail=[];
        this.zoneBoost=0; this.zoneSlow=0; this.zoneEffect=null;
        this.isBot=false;
    }
    setStart(pos) { this.startPos=pos; }
    reset() {
        this.x=this.startPos.x; this.y=this.startPos.y;
        this.angle=this.startPos.angle; this.speed=0;
        this.prevX=this.x; this.prevY=this.y; this.finished=false;
        this.boostTimer=0; this.boostFuel=3; this.trail=[];
        this.zoneBoost=0; this.zoneSlow=0; this.zoneEffect=null;
    }
    update() {
        this.prevX=this.x; this.prevY=this.y;
        if (boostKeys[this.controls.up]) { if(this.boostFuel>0) this.boostTimer=Math.min(this.boostFuel,1.8); boostKeys[this.controls.up]=false; }
        if (this.boostTimer>0) { this.boostTimer-=1/60; this.boostFuel=Math.max(0,this.boostFuel-1/60); }
        const boosting=this.boostTimer>0;
        const MAX=boosting?9.5:5.2, ACCEL=boosting?0.38:0.22, FRIC=0.91, TURN=0.068;
        if      (keys[this.controls.up])   this.speed+=ACCEL;
        else if (keys[this.controls.down]) this.speed-=ACCEL*0.85;
        else                               this.speed*=FRIC;
        this.speed=Math.max(-MAX*0.45,Math.min(MAX,this.speed));
        if (Math.abs(this.speed)>0.08) {
            const dir=Math.sign(this.speed);
            const tf=0.45+0.55*Math.min(Math.abs(this.speed)/MAX,1);
            if (keys[this.controls.left])  this.angle-=TURN*dir*tf;
            if (keys[this.controls.right]) this.angle+=TURN*dir*tf;
        }
        const nx=this.x+Math.sin(this.angle)*this.speed;
        const ny=this.y-Math.cos(this.angle)*this.speed;
        if      (isOnTrack(nx,ny))     {this.x=nx;this.y=ny;}
        else if (isOnTrack(nx,this.y)) {this.x=nx;this.speed*=0.65;}
        else if (isOnTrack(this.x,ny)) {this.y=ny;this.speed*=0.65;}
        else                           {this.speed*=-0.25;}
        const zone=checkZone(this);
        if (zone==='boost') this.zoneBoost=2.5;
        if (zone==='slow')  this.zoneSlow=2.2;
        if      (this.zoneBoost>0) { this.zoneBoost-=1/60; this.speed=Math.min(this.speed*1.06+0.2,8.5); this.zoneEffect='boost'; }
        else if (this.zoneSlow>0)  { this.zoneSlow-=1/60;  this.speed*=0.88; this.zoneEffect='slow'; }
        else                       { this.zoneEffect=null; }
        if (boosting || this.zoneEffect==='boost') {
            this.trail.push({x:this.x,y:this.y,life:1,
                color:TRAIL_COLORS[Math.floor(performance.now()/60)%TRAIL_COLORS.length]});
        }
        for (const p of this.trail) p.life-=0.045;
        this.trail=this.trail.filter(p=>p.life>0);
    }
    crossedFinish() { return currentCircuit.crossedFinish(this); }
    drawTrail() {
        for (const p of this.trail) {
            ctx.globalAlpha=p.life*0.7;
            ctx.fillStyle=p.color;
            ctx.beginPath(); ctx.arc(p.x,p.y,7*p.life,0,Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha=1;
    }
    draw() {
        if (this.zoneEffect==='boost') {
            ctx.save(); ctx.translate(this.x,this.y);
            ctx.strokeStyle='rgba(0,255,100,0.7)'; ctx.lineWidth=3;
            ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.stroke(); ctx.restore();
        } else if (this.zoneEffect==='slow') {
            ctx.save(); ctx.translate(this.x,this.y);
            ctx.strokeStyle='rgba(180,80,0,0.75)'; ctx.lineWidth=3;
            ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.stroke(); ctx.restore();
        }
        if (this.boostTimer>0) {
            ctx.save(); ctx.translate(this.x,this.y);
            const glow=ctx.createRadialGradient(0,0,4,0,0,34);
            const hue=(performance.now()/5)%360;
            glow.addColorStop(0,`hsla(${hue|0},100%,70%,0.75)`); glow.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,0,34,0,Math.PI*2); ctx.fill(); ctx.restore();
        }
        ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.angle);
        const C=this.color, HI=this.hi, DARK='#0a0a0a', GREY='#2a2a2a';
        ctx.fillStyle='rgba(0,0,0,0.32)'; ctx.beginPath(); ctx.ellipse(2,3,13,22,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=DARK; ctx.beginPath(); ctx.roundRect(-16,-20,32,5,2); ctx.fill();
        ctx.fillStyle=C;    ctx.beginPath(); ctx.roundRect(-13,-23,26,4,1); ctx.fill();
        ctx.fillStyle=C; ctx.beginPath(); ctx.moveTo(-3,-24); ctx.lineTo(3,-24); ctx.lineTo(4,-17); ctx.lineTo(-4,-17); ctx.closePath(); ctx.fill();
        ctx.fillStyle=C; ctx.beginPath(); ctx.moveTo(-9,-17); ctx.lineTo(9,-17); ctx.lineTo(11,8); ctx.lineTo(-11,8); ctx.closePath(); ctx.fill();
        const shine=ctx.createLinearGradient(-9,-17,9,-17);
        shine.addColorStop(0,'rgba(255,255,255,0)'); shine.addColorStop(0.35,'rgba(255,255,255,0.22)'); shine.addColorStop(0.5,'rgba(255,255,255,0)');
        ctx.fillStyle=shine; ctx.beginPath(); ctx.moveTo(-9,-17); ctx.lineTo(9,-17); ctx.lineTo(11,8); ctx.lineTo(-11,8); ctx.closePath(); ctx.fill();
        ctx.fillStyle='rgba(30,60,120,0.85)'; ctx.beginPath(); ctx.ellipse(0,-4,4.5,7,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(160,220,255,0.55)'; ctx.beginPath(); ctx.ellipse(-1.2,-5.5,2,3,-0.3,0,Math.PI*2); ctx.fill();
        [-1,1].forEach(s=>{
            ctx.fillStyle=GREY; ctx.beginPath(); ctx.roundRect(s*9-3,-12,6,16,2); ctx.fill();
            ctx.fillStyle=HI;   ctx.beginPath(); ctx.roundRect(s*9-3,-12,2,16,1); ctx.fill();
        });
        ctx.fillStyle=DARK; ctx.beginPath(); ctx.roundRect(-2,7,4,7,1); ctx.fill();
        ctx.fillStyle=DARK; ctx.beginPath(); ctx.roundRect(-15,6,30,4,2); ctx.fill();
        ctx.fillStyle=C;    ctx.beginPath(); ctx.roundRect(-14,4,28,3,1); ctx.fill();
        [-14,13].forEach(ex=>{ ctx.fillStyle=DARK; ctx.beginPath(); ctx.roundRect(ex,4,3,8,1); ctx.fill(); });
        [[-13,-10,4,6],[10,-10,4,6],[-14,2,5,7],[10,2,5,7]].forEach(([wx,wy,rw,rh])=>{
            ctx.fillStyle=DARK; ctx.beginPath(); ctx.roundRect(wx,wy,rw,rh,1); ctx.fill();
            ctx.fillStyle='#444'; ctx.beginPath(); ctx.roundRect(wx+0.5,wy+1,rw-1,rh-2,1); ctx.fill();
        });
        ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.font='bold 7px Arial';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(this.label[0]==='B'?'1':this.label[0]==='R'?'2':this.label[0],0,-4);
        ctx.restore();
    }
}

// ════════════════════════════════════════════════════════════
//  BOT CAR  (AI, no boost)
// ════════════════════════════════════════════════════════════
class BotCar extends Car {
    constructor(color, hi, label, wpNum) {
        super(color, hi, {up:null,down:null,left:null,right:null}, label);
        this.isBot = true;
        this.wpNum = wpNum;  // 0 or 1 for bot1/bot2
        this.wpIdx = 0;
        this.stuckTimer = 0;
        this.stuckX = 0; this.stuckY = 0;
    }
    reset() {
        super.reset();
        this.wpIdx = 0;
        this.stuckTimer = 0;
    }
    update() {
        this.prevX=this.x; this.prevY=this.y;
        const D=DIFF_PRESETS[botDifficulty];
        const MAX=D.maxSpeed, ACCEL=D.accel, FRIC=0.91, TURN=D.turn;

        const wps = currentCircuit.botWaypoints;
        if (wps && wps.length > 0) {
            const wp = wps[this.wpIdx % wps.length];
            const dx = wp.x - this.x, dy = wp.y - this.y;
            const dist = Math.sqrt(dx*dx+dy*dy);
            if (dist < D.wpRadius) this.wpIdx = (this.wpIdx+1) % wps.length;

            const targetAngle = Math.atan2(dx, -dy);
            let diff = targetAngle - this.angle;
            while(diff > Math.PI) diff -= Math.PI*2;
            while(diff < -Math.PI) diff += Math.PI*2;

            const tf = 0.45+0.55*Math.min(Math.abs(this.speed)/MAX,1);
            if (diff > 0.04)       this.angle += TURN*tf;
            else if (diff < -0.04) this.angle -= TURN*tf;
        }

        // Brake on tight turns, else accelerate
        const wps2 = currentCircuit.botWaypoints;
        let braking = false;
        if (wps2 && wps2.length > 0) {
            const ahead = wps2[(this.wpIdx+2) % wps2.length];
            const dx2 = ahead.x-this.x, dy2 = ahead.y-this.y;
            const tA2 = Math.atan2(dx2,-dy2);
            let d2 = tA2 - this.angle;
            while(d2>Math.PI) d2-=Math.PI*2; while(d2<-Math.PI) d2+=Math.PI*2;
            if (Math.abs(d2) > D.brakeAngle && this.speed > 2.2) braking = true;
        }
        if (braking) this.speed -= ACCEL*0.7;
        else         this.speed += ACCEL;
        this.speed = Math.max(0, Math.min(MAX, this.speed));

        const nx=this.x+Math.sin(this.angle)*this.speed;
        const ny=this.y-Math.cos(this.angle)*this.speed;
        if      (isOnTrack(nx,ny))     {this.x=nx;this.y=ny;}
        else if (isOnTrack(nx,this.y)) {this.x=nx;this.speed*=0.65;}
        else if (isOnTrack(this.x,ny)) {this.y=ny;this.speed*=0.65;}
        else                           {this.speed*=-0.3;}

        // Unstuck logic
        const moved = Math.abs(this.x-this.stuckX)+Math.abs(this.y-this.stuckY);
        if (moved < 0.5) { this.stuckTimer += 1/60; }
        else             { this.stuckTimer = 0; this.stuckX=this.x; this.stuckY=this.y; }
        if (this.stuckTimer > 1.2) {
            this.wpIdx = (this.wpIdx+1) % (currentCircuit.botWaypoints||[1]).length;
            this.stuckTimer = 0;
            this.speed = -1.5;
        }

        const zone=checkZone(this);
        if (zone==='boost') this.zoneBoost=2.5;
        if (zone==='slow')  this.zoneSlow=2.2;
        if      (this.zoneBoost>0) { this.zoneBoost-=1/60; this.speed=Math.min(this.speed*1.06+0.2,8.5); this.zoneEffect='boost'; }
        else if (this.zoneSlow>0)  { this.zoneSlow-=1/60;  this.speed*=0.88; this.zoneEffect='slow'; }
        else                       { this.zoneEffect=null; }
    }
    draw() {
        // Same as parent but no boost glow — just the zone glow
        if (this.zoneEffect==='boost') {
            ctx.save(); ctx.translate(this.x,this.y);
            ctx.strokeStyle='rgba(0,255,100,0.7)'; ctx.lineWidth=3;
            ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.stroke(); ctx.restore();
        } else if (this.zoneEffect==='slow') {
            ctx.save(); ctx.translate(this.x,this.y);
            ctx.strokeStyle='rgba(180,80,0,0.75)'; ctx.lineWidth=3;
            ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.stroke(); ctx.restore();
        }
        ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.angle);
        const C=this.color, HI=this.hi, DARK='#0a0a0a', GREY='#2a2a2a';
        ctx.fillStyle='rgba(0,0,0,0.32)'; ctx.beginPath(); ctx.ellipse(2,3,13,22,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=DARK; ctx.beginPath(); ctx.roundRect(-16,-20,32,5,2); ctx.fill();
        ctx.fillStyle=C;    ctx.beginPath(); ctx.roundRect(-13,-23,26,4,1); ctx.fill();
        ctx.fillStyle=C; ctx.beginPath(); ctx.moveTo(-3,-24); ctx.lineTo(3,-24); ctx.lineTo(4,-17); ctx.lineTo(-4,-17); ctx.closePath(); ctx.fill();
        ctx.fillStyle=C; ctx.beginPath(); ctx.moveTo(-9,-17); ctx.lineTo(9,-17); ctx.lineTo(11,8); ctx.lineTo(-11,8); ctx.closePath(); ctx.fill();
        const shine=ctx.createLinearGradient(-9,-17,9,-17);
        shine.addColorStop(0,'rgba(255,255,255,0)'); shine.addColorStop(0.35,'rgba(255,255,255,0.22)'); shine.addColorStop(0.5,'rgba(255,255,255,0)');
        ctx.fillStyle=shine; ctx.beginPath(); ctx.moveTo(-9,-17); ctx.lineTo(9,-17); ctx.lineTo(11,8); ctx.lineTo(-11,8); ctx.closePath(); ctx.fill();
        ctx.fillStyle='rgba(30,60,120,0.85)'; ctx.beginPath(); ctx.ellipse(0,-4,4.5,7,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(160,220,255,0.55)'; ctx.beginPath(); ctx.ellipse(-1.2,-5.5,2,3,-0.3,0,Math.PI*2); ctx.fill();
        [-1,1].forEach(s=>{
            ctx.fillStyle=GREY; ctx.beginPath(); ctx.roundRect(s*9-3,-12,6,16,2); ctx.fill();
            ctx.fillStyle=HI;   ctx.beginPath(); ctx.roundRect(s*9-3,-12,2,16,1); ctx.fill();
        });
        ctx.fillStyle=DARK; ctx.beginPath(); ctx.roundRect(-2,7,4,7,1); ctx.fill();
        ctx.fillStyle=DARK; ctx.beginPath(); ctx.roundRect(-15,6,30,4,2); ctx.fill();
        ctx.fillStyle=C;    ctx.beginPath(); ctx.roundRect(-14,4,28,3,1); ctx.fill();
        [-14,13].forEach(ex=>{ ctx.fillStyle=DARK; ctx.beginPath(); ctx.roundRect(ex,4,3,8,1); ctx.fill(); });
        [[-13,-10,4,6],[10,-10,4,6],[-14,2,5,7],[10,2,5,7]].forEach(([wx,wy,rw,rh])=>{
            ctx.fillStyle=DARK; ctx.beginPath(); ctx.roundRect(wx,wy,rw,rh,1); ctx.fill();
            ctx.fillStyle='#444'; ctx.beginPath(); ctx.roundRect(wx+0.5,wy+1,rw-1,rh-2,1); ctx.fill();
        });
        // BOT label
        ctx.fillStyle='rgba(255,255,80,0.9)'; ctx.font='bold 7px Arial';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('BOT',0,-4);
        ctx.restore();
    }
}

const blueCar = new Car('#1155ee','#3377ff',{up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'},'Bleue (↑↓←→)');
const redCar  = new Car('#cc1111','#ee3333',{up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD'},'Rouge (WASD)');
const bot1    = new BotCar('#ddaa00','#ffcc22','Bot 1', 0);
const bot2    = new BotCar('#118844','#22cc66','Bot 2', 1);

// ════════════════════════════════════════════════════════════
//  GRANDSTAND HELPERS
// ════════════════════════════════════════════════════════════
const SEAT_PAL=['#cc2020','#1144cc','#119933','#ccaa00','#882299','#cc6611'];
function specColor(seed){
    const h=((seed*137)%360+360)%360;
    return `hsl(${h|0},${50+(seed*71)%35|0}%,${42+(seed*53)%22|0}%)`;
}
function drawStand(c,x,y,w,h,tiers,horiz){
    const bg=horiz?c.createLinearGradient(x,y,x,y+h):c.createLinearGradient(x,y,x+w,y);
    bg.addColorStop(0,'#525258'); bg.addColorStop(1,'#3e3e48');
    c.fillStyle=bg; c.fillRect(x,y,w,h);
    const dim=horiz?h:w, step=dim/tiers;
    for(let r=0;r<tiers;r++){
        const rx=horiz?x:x+r*step, ry=horiz?y+r*step:y, rw=horiz?w:step, rh=horiz?step:h;
        c.fillStyle=r%2===0?'rgba(0,0,0,0.15)':'rgba(255,255,255,0.05)'; c.fillRect(rx,ry,rw,rh);
        c.fillStyle='rgba(255,255,255,0.2)';
        if(horiz) c.fillRect(rx,ry,rw,2); else c.fillRect(rx,ry,2,rh);
        const sec=85, main=horiz?rw:rh;
        for(let s=0;s*sec<main;s++){
            c.fillStyle=SEAT_PAL[(s+r*5)%SEAT_PAL.length]; c.globalAlpha=0.45;
            if(horiz) c.fillRect(rx+s*sec+1,ry+4,Math.min(sec-2,main-s*sec-2),rh-8);
            else      c.fillRect(rx+4,ry+s*sec+1,rw-8,Math.min(sec-2,main-s*sec-2));
            c.globalAlpha=1;
        }
        if(horiz){
            const hy=ry+rh*0.52;
            for(let sx=rx+6;sx<rx+rw-6;sx+=11){
                const seed=(sx*13+r*97)|0; c.fillStyle=specColor(seed);
                c.beginPath(); c.ellipse(sx,hy,4,4.5,0,0,Math.PI*2); c.fill();
                c.fillStyle='rgba(255,255,255,0.28)';
                c.beginPath(); c.ellipse(sx-1.2,hy-1.8,1.8,1.5,-0.5,0,Math.PI*2); c.fill();
            }
        } else {
            const hx=rx+rw*0.52;
            for(let sy=ry+6;sy<ry+rh-6;sy+=11){
                const seed=(sy*13+r*97)|0; c.fillStyle=specColor(seed);
                c.beginPath(); c.ellipse(hx,sy,4,4.5,0,0,Math.PI*2); c.fill();
                c.fillStyle='rgba(255,255,255,0.28)';
                c.beginPath(); c.ellipse(hx-1.2,sy-1.8,1.8,1.5,-0.5,0,Math.PI*2); c.fill();
            }
        }
    }
    c.strokeStyle='#1a1a22'; c.lineWidth=2; c.strokeRect(x,y,w,h);
    c.fillStyle='#191924';
    if(horiz) c.fillRect(x,y,w,10); else c.fillRect(x,y,10,h);
    c.fillStyle='rgba(255,255,255,0.09)';
    if(horiz) c.fillRect(x,y+10,w,3); else c.fillRect(x+10,y,3,h);
}
function standLabel(c,text,x,y,angle){
    c.save(); c.translate(x,y); if(angle) c.rotate(angle);
    c.fillStyle='rgba(255,255,255,0.6)'; c.font='bold 13px Arial'; c.textAlign='center';
    c.fillText(text,0,0); c.restore();
}

// ════════════════════════════════════════════════════════════
//  CIRCUIT FACTORY
// ════════════════════════════════════════════════════════════
function makeCircuit(def){
    const mc=document.createElement('canvas'); mc.width=W; mc.height=H;
    const mx=mc.getContext('2d');
    mx.fillStyle='#000'; mx.fillRect(0,0,W,H);
    mx.strokeStyle='#fff'; mx.lineWidth=TRACK_W; mx.lineCap='round'; mx.lineJoin='round';
    mx.stroke(def.path);
    const MASK=mx.getImageData(0,0,W,H).data;
    function isOnTrack(x,y){ const xi=x|0,yi=y|0; if(xi<0||xi>=W||yi<0||yi>=H) return false; return MASK[(yi*W+xi)*4]>128; }

    const zones=def.zones.map(z=>({...z,active:true}));
    function resetZones(){ zones.forEach(z=>z.active=true); }
    function checkZone(car){
        for(const z of zones){ if(!z.active) continue; const dx=car.x-z.x,dy=car.y-z.y; if(dx*dx+dy*dy<z.r*z.r){z.active=false;return z.type;} }
        return null;
    }
    function drawZonesLive(){
        for(const z of zones){
            if(!z.active) continue;
            ctx.save(); ctx.translate(z.x,z.y);
            if(z.type==='boost'){
                const pulse=0.55+0.2*Math.sin(performance.now()/200);
                const g=ctx.createRadialGradient(0,0,2,0,0,z.r);
                g.addColorStop(0,`rgba(0,255,120,${pulse})`); g.addColorStop(1,'rgba(0,180,60,0)');
                ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,z.r,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.font=`bold ${z.r*0.9|0}px Arial`; ctx.fillText('▲',0,2);
            } else {
                const g=ctx.createRadialGradient(0,0,2,0,0,z.r);
                g.addColorStop(0,'rgba(90,50,10,0.85)'); g.addColorStop(0.6,'rgba(60,30,5,0.6)'); g.addColorStop(1,'rgba(40,20,0,0)');
                ctx.fillStyle=g; ctx.beginPath();
                for(let i=0;i<12;i++){const a=(i/12)*Math.PI*2,rr=z.r*(0.7+0.3*Math.sin(i*2.3+1));i===0?ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
                ctx.closePath(); ctx.fill();
                ctx.fillStyle='rgba(255,180,0,0.95)'; ctx.textAlign='center'; ctx.textBaseline='middle';

            }

        }
    }

    const sc=document.createElement('canvas'); sc.width=W; sc.height=H;
    def.buildStands(sc.getContext('2d'));

    const tc=document.createElement('canvas'); tc.width=W; tc.height=H;

    g2.addColorStop(0,def.grassIn); g2.addColorStop(1,def.grassInD);
    tctx.fillStyle=g2; tctx.fill(def.path);
    tctx.drawImage(sc,0,0);
    const tmp=document.createElement('canvas'); tmp.width=W; tmp.height=H;
    const tc2=tmp.getContext('2d');
    tc2.strokeStyle='#bb2222'; tc2.lineWidth=TRACK_W+10; tc2.lineCap='round'; tc2.lineJoin='round';
    tc2.setLineDash([20,20]); tc2.stroke(def.path); tc2.setLineDash([]);
    tc2.strokeStyle='#484848'; tc2.lineWidth=TRACK_W; tc2.stroke(def.path);
    tc2.strokeStyle='#bb2222'; tc2.lineWidth=6; tc2.setLineDash([20,20]); tc2.stroke(def.path); tc2.setLineDash([]);

    tc2.globalCompositeOperation='destination-in'; tc2.drawImage(mc,0,0);
    tctx.drawImage(tmp,0,0);
    def.buildDecor(tctx, def.path);

             startBlue:def.startBlue, startRed:def.startRed,
             startBot1:def.startBot1, startBot2:def.startBot2,
             botWaypoints:def.botWaypoints,
             crossedFinish:def.crossedFinish, name:def.name };
}

let stars=[];
function spawnStars(){
    stars=[];
    for(let i=0;i<80;i++){
        const a=Math.random()*Math.PI*2,sp=Math.random()*6+2;
        stars.push({x:W/2,y:H/2-40,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,
            size:Math.random()*7+2,color:`hsl(${Math.random()*360|0},100%,65%)`,
            life:1,decay:Math.random()*0.007+0.003,gravity:0.12});
    }
}
function updateStars(){
    for(const s of stars){
        s.x+=s.vx;s.y+=s.vy;s.vy+=s.gravity;s.life-=s.decay;
        if(s.life<=0){
            const a=Math.random()*Math.PI*2,sp=Math.random()*6+2;
            s.x=W/2;s.y=H/2-60;s.vx=Math.cos(a)*sp;s.vy=Math.sin(a)*sp-2;
            s.life=1;s.color=`hsl(${Math.random()*360|0},100%,65%)`;
        }
        ctx.globalAlpha=Math.max(0,s.life);
        ctx.fillStyle=s.color; ctx.beginPath(); ctx.arc(s.x,s.y,s.size*s.life,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
}

const TOTAL_ROUNDS=10;
let round=1,scores={blue:0,red:0,bot1:0,bot2:0},gameState='menu';
let countdown=3,cdTimer=0,roundWinner=null,reTimer=0;
let goTimer=0,goShowing=false,gameOverTimer=0,showRestart=false;

function activeBots(){ return [bot1,bot2].slice(0,playerCount-2); }

function nearestWpAhead(car){
    const wps=currentCircuit.botWaypoints;
    if(!wps||!wps.length) return 0;
    let best=0, bestDist=Infinity;
    for(let i=0;i<wps.length;i++){
        const dx=wps[i].x-car.x, dy=wps[i].y-car.y;
        // Only consider waypoints roughly in front (dot product with heading > 0)
        const inFront = dx*Math.sin(car.angle) + dy*(-Math.cos(car.angle));
        if(inFront < 0) continue;
        const d=dx*dx+dy*dy;
        if(d<bestDist){bestDist=d;best=i;}
    }
    return best;
}

function startRound(){
    currentCircuit = circuits[(round-1)%2];
    blueCar.setStart(currentCircuit.startBlue); blueCar.reset();
    redCar.setStart(currentCircuit.startRed);   redCar.reset();
    if(playerCount>=3){ bot1.setStart(currentCircuit.startBot1); bot1.reset(); bot1.wpIdx=nearestWpAhead(bot1); }
    if(playerCount>=4){ bot2.setStart(currentCircuit.startBot2); bot2.reset(); bot2.wpIdx=nearestWpAhead(bot2); }
    roundWinner=null; resetZones();
    if(gameState!=='menu') gameState='countdown';
    countdown=3; cdTimer=0; goShowing=false; goTimer=0;
}
function restartGame(){
    scores={blue:0,red:0,bot1:0,bot2:0}; round=1; showRestart=false;
    trophyScale=0; trophyBob=0; stars=[]; canvas.style.cursor='default';
    gameState='countdown'; startRound();
}

// ════════════════════════════════════════════════════════════
//  MAIN LOOP
// ════════════════════════════════════════════════════════════
let lastTime=0;
function loop(ts){
    const dt=Math.min((ts-lastTime)/1000,0.1); lastTime=ts;
    drawTrack();
    if(gameState==='menu'){
        drawMenu(dt);
    } else if(gameState==='countdown'){
        for(const b of activeBots()) b.draw();
        blueCar.draw(); redCar.draw(); drawHUD();
        if(!goShowing){
            cdTimer+=dt; if(cdTimer>=1){cdTimer=0;countdown--;}
            if(countdown<=0){goShowing=true;goTimer=0;}
            else{const cs=['#ff4444','#ffaa00','#ffff00'];drawCountdown(String(countdown),cs[countdown-1]);}
        } else {
            goTimer+=dt; drawCountdown('PARTEZ !','#00ff88');
            if(goTimer>=0.75) gameState='racing';
        }
    } else if(gameState==='racing'){
        blueCar.update(); redCar.update();
        for(const b of activeBots()) b.update();

        const bF=blueCar.crossedFinish(),rF=redCar.crossedFinish();
        const b1F=playerCount>=3?bot1.crossedFinish():false;
        const b2F=playerCount>=4?bot2.crossedFinish():false;

        if(!roundWinner){
            if(bF){roundWinner='blue';scores.blue++;}
            else if(rF){roundWinner='red'; scores.red++;}
            else if(b1F){roundWinner='bot1';scores.bot1++;}
            else if(b2F){roundWinner='bot2';scores.bot2++;}
        }
        if(roundWinner) gameState='roundEnd',reTimer=0;

        drawZones();
        blueCar.drawTrail(); redCar.drawTrail();
        for(const b of activeBots()) b.draw();
        blueCar.draw(); redCar.draw(); drawHUD();
    } else if(gameState==='roundEnd'){
        for(const b of activeBots()) b.draw();
        blueCar.drawTrail(); redCar.drawTrail();
        blueCar.draw(); redCar.draw(); drawHUD(); drawRoundBanner();
        reTimer+=dt;
        if(reTimer>=2.2){
            if(round>=TOTAL_ROUNDS){gameState='gameOver';gameOverTimer=0;showRestart=false;spawnStars();}
            else{round++;startRound();}
        }
    } else if(gameState==='gameOver'){
        gameOverTimer+=dt;
        ctx.fillStyle='rgba(0,0,0,0.78)'; ctx.fillRect(0,0,W,H);
        updateStars();
        const winner=scores.blue>scores.red?'blue':scores.red>scores.blue?'red':'draw';
        drawTrophy(winner);
        if(gameOverTimer>=3&&!showRestart) showRestart=true;
        if(showRestart) drawRestartBtn();
    }
    requestAnimationFrame(loop);
}

currentCircuit=circuits[0];
blueCar.setStart(currentCircuit.startBlue); blueCar.reset();
redCar.setStart(currentCircuit.startRed);   redCar.reset();
bot1.setStart(currentCircuit.startBot1); bot1.reset();
bot2.setStart(currentCircuit.startBot2); bot2.reset();
requestAnimationFrame(loop);
</script>
