<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Course de Voitures</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Arial Black', Arial, sans-serif;
    overflow: hidden;
}
canvas {
    border: 3px solid #333;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(80, 120, 255, 0.25);
    display: block;
}
</style>
</head>
<body>
<canvas id="gameCanvas" width="900" height="640"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Track geometry ─────────────────────────────────────────────────────────
const CX = 450, CY = 305;
const OUTER = { rx: 410, ry: 265 };
const INNER = { rx: 238, ry: 148 };

// Finish line at x = FIN_X, from FIN_Y1 to FIN_Y2 (bottom of track)
const FIN_X  = 450;
const FIN_Y1 = CY + INNER.ry + 6;   // ≈ 459
const FIN_Y2 = CY + OUTER.ry - 6;   // ≈ 564

// Car start positions (just left of finish, bottom of track, pointing east)
const START_BLUE = { x: 410, y: FIN_Y1 + 32, angle: Math.PI / 2 };
const START_RED  = { x: 410, y: FIN_Y1 + 72, angle: Math.PI / 2 };

// ── Helpers ────────────────────────────────────────────────────────────────
function isOnTrack(x, y) {
    const o = ((x - CX) / OUTER.rx) ** 2 + ((y - CY) / OUTER.ry) ** 2;
    const i = ((x - CX) / INNER.rx) ** 2 + ((y - CY) / INNER.ry) ** 2;
    return o <= 1.0 && i >= 1.0;
}

// ── Keys ───────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))
        e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ── Car class ──────────────────────────────────────────────────────────────
class Car {
    constructor(startPos, color, highlight, controls, label) {
        this.startPos  = startPos;
        this.color     = color;
        this.highlight = highlight;
        this.controls  = controls;
        this.label     = label;
        this.reset();
    }

    reset() {
        this.x        = this.startPos.x;
        this.y        = this.startPos.y;
        this.angle    = this.startPos.angle;
        this.speed    = 0;
        this.prevX    = this.x;
        this.finished = false;
    }

    update() {
        this.prevX = this.x;

        const MAX   = 5.2;
        const ACCEL = 0.22;
        const FRIC  = 0.91;
        const TURN  = 0.054;

        if (keys[this.controls.up])   this.speed += ACCEL;
        else if (keys[this.controls.down]) this.speed -= ACCEL * 0.85;
        else this.speed *= FRIC;

        this.speed = Math.max(-MAX * 0.45, Math.min(MAX, this.speed));

        if (Math.abs(this.speed) > 0.15) {
            const dir = Math.sign(this.speed);
            if (keys[this.controls.left])  this.angle -= TURN * dir;
            if (keys[this.controls.right]) this.angle += TURN * dir;
        }

        const nx = this.x + Math.sin(this.angle) * this.speed;
        const ny = this.y - Math.cos(this.angle) * this.speed;

        if (isOnTrack(nx, ny)) {
            this.x = nx;
            this.y = ny;
        } else if (isOnTrack(nx, this.y)) {
            this.x = nx;
            this.speed *= 0.65;
        } else if (isOnTrack(this.x, ny)) {
            this.y = ny;
            this.speed *= 0.65;
        } else {
            this.speed *= -0.25;
        }
    }

    crossedFinish() {
        if (this.finished) return false;
        if (this.prevX < FIN_X && this.x >= FIN_X &&
            this.y >= FIN_Y1 && this.y <= FIN_Y2) {
            this.finished = true;
            return true;
        }
        return false;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        const CW = 18, CH = 32;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.beginPath();
        ctx.ellipse(3, 4, CW / 2, CH / 2.2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Body
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.roundRect(-CW / 2, -CH / 2, CW, CH, 5);
        ctx.fill();

        // Highlight stripe
        ctx.fillStyle = this.highlight;
        ctx.fillRect(-CW / 2 + 4, -CH / 2 + 1, CW - 8, CH - 2);

        // Body re-outline
        ctx.fillStyle = this.color;
        ctx.fillRect(-CW / 2, -CH / 2 + 8, CW, CH - 16);

        // Windshield front
        ctx.fillStyle = 'rgba(160,220,255,0.82)';
        ctx.beginPath();
        ctx.roundRect(-CW / 2 + 3, -CH / 2 + 4, CW - 6, 9, 2);
        ctx.fill();

        // Windshield rear
        ctx.fillStyle = 'rgba(160,220,255,0.55)';
        ctx.beginPath();
        ctx.roundRect(-CW / 2 + 3, CH / 2 - 12, CW - 6, 8, 2);
        ctx.fill();

        // Wheels (4)
        ctx.fillStyle = '#111';
        [[-CW / 2 - 4, -CH / 2 + 4],
         [ CW / 2 - 1, -CH / 2 + 4],
         [-CW / 2 - 4,  CH / 2 - 12],
         [ CW / 2 - 1,  CH / 2 - 12]].forEach(([wx, wy]) => {
            ctx.fillRect(wx, wy, 5, 8);
            ctx.fillStyle = '#444';
            ctx.fillRect(wx + 1, wy + 1, 3, 6);
            ctx.fillStyle = '#111';
        });

        ctx.restore();
    }
}

const blueCar = new Car(
    START_BLUE, '#1155ee', '#3377ff',
    { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' },
    'Bleue (↑↓←→)'
);
const redCar = new Car(
    START_RED, '#cc1111', '#ee3333',
    { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD' },
    'Rouge (WASD)'
);

// ── Game state ─────────────────────────────────────────────────────────────
const TOTAL_ROUNDS = 10;
let round       = 1;
let scores      = { blue: 0, red: 0 };
let gameState   = 'countdown';   // countdown | racing | roundEnd | gameOver
let countdown   = 3;
let cdTimer     = 0;
let roundWinner = null;
let reTimer     = 0;
let goTimer     = 0;
let goShowing   = false;
let gameOverTimer = 0;
let showRestart = false;
let stars       = [];
let trophyBob   = 0;
let trophyScale = 0;

// ── Draw: track ────────────────────────────────────────────────────────────
function drawTrack() {
    // Sky / outer fill
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, W, H);

    // Grass (outer)
    const g1 = ctx.createRadialGradient(CX, CY, 80, CX, CY, 520);
    g1.addColorStop(0, '#3c8235');
    g1.addColorStop(1, '#254f1e');
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, W, H);

    // Road
    ctx.fillStyle = '#484848';
    ctx.beginPath();
    ctx.ellipse(CX, CY, OUTER.rx, OUTER.ry, 0, 0, Math.PI * 2);
    ctx.fill();

    // Road outer kerb
    ctx.strokeStyle = '#bb2222';
    ctx.lineWidth = 6;
    ctx.setLineDash([24, 24]);
    ctx.beginPath();
    ctx.ellipse(CX, CY, OUTER.rx, OUTER.ry, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Road surface texture (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let t = 0; t < Math.PI * 2; t += 0.08) {
        const mx = CX + ((OUTER.rx + INNER.rx) / 2) * Math.sin(t);
        const my = CY - ((OUTER.ry + INNER.ry) / 2) * Math.cos(t);
        ctx.beginPath();
        ctx.arc(mx, my, 2, 0, Math.PI * 2);
        ctx.stroke();
    }

    // Inner grass
    const g2 = ctx.createRadialGradient(CX, CY - 30, 20, CX, CY, 200);
    g2.addColorStop(0, '#47943d');
    g2.addColorStop(1, '#2d5e25');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.ellipse(CX, CY, INNER.rx, INNER.ry, 0, 0, Math.PI * 2);
    ctx.fill();

    // Inner kerb
    ctx.strokeStyle = '#bb2222';
    ctx.lineWidth = 6;
    ctx.setLineDash([24, 24]);
    ctx.beginPath();
    ctx.ellipse(CX, CY, INNER.rx, INNER.ry, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Center dashed line
    const mRx = (OUTER.rx + INNER.rx) / 2;
    const mRy = (OUTER.ry + INNER.ry) / 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 2;
    ctx.setLineDash([22, 22]);
    ctx.beginPath();
    ctx.ellipse(CX, CY, mRx, mRy, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // ── Finish / Start line (checkered) ─────────────────────────────────
    const sq   = 10;
    const lx   = FIN_X - 15;
    const cols = 3;
    for (let y = FIN_Y1; y < FIN_Y2; y += sq) {
        for (let c = 0; c < cols; c++) {
            const row = Math.floor((y - FIN_Y1) / sq);
            ctx.fillStyle = (row + c) % 2 === 0 ? 'white' : 'black';
            ctx.fillRect(lx + c * sq, y, sq, Math.min(sq, FIN_Y2 - y));
        }
    }

    // "DÉPART / ARRIVÉE" label
    ctx.save();
    ctx.translate(FIN_X + 18, (FIN_Y1 + FIN_Y2) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('DÉPART / ARRIVÉE', 0, 4);
    ctx.restore();
}

// ── Draw: HUD ──────────────────────────────────────────────────────────────
function roundedBox(x, y, w, h, r, fill, alpha = 0.7) {
    ctx.fillStyle = fill;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
    ctx.globalAlpha = 1;
}

function drawHUD() {
    // Blue score
    roundedBox(8, 8, 195, 62, 10, '#001133');
    ctx.fillStyle = '#4488ff';
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'left';
    ctx.fillText('🔵  ' + blueCar.label, 18, 28);
    ctx.font = 'bold 32px Arial Black';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(scores.blue + ' pt' + (scores.blue !== 1 ? 's' : ''), 22, 60);

    // Red score
    roundedBox(W - 203, 8, 195, 62, 10, '#1a0000');
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'right';
    ctx.fillText(redCar.label + '  🔴', W - 18, 28);
    ctx.font = 'bold 32px Arial Black';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'right';
    ctx.fillText(scores.red + ' pt' + (scores.red !== 1 ? 's' : ''), W - 22, 60);
    ctx.textAlign = 'left';

    // Round counter
    roundedBox(W / 2 - 90, 8, 180, 42, 10, '#0a0a22');
    ctx.fillStyle = '#ccccff';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Manche  ' + round + ' / ' + TOTAL_ROUNDS, W / 2, 34);
    ctx.textAlign = 'left';
}

// ── Draw: countdown overlay ────────────────────────────────────────────────
function drawCountdown(text, color) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold 130px Arial Black';
    ctx.shadowColor = color;
    ctx.shadowBlur = 40;
    ctx.fillStyle = color;
    ctx.fillText(text, W / 2, H / 2 + 50);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';
}

// ── Draw: round winner banner ──────────────────────────────────────────────
function drawRoundBanner() {
    if (!roundWinner) return;
    const color = roundWinner === 'blue' ? '#3399ff' : '#ff3333';
    const name  = roundWinner === 'blue' ? 'Bleue' : 'Rouge';

    roundedBox(W / 2 - 220, H / 2 - 40, 440, 80, 16, '#000000', 0.65);
    ctx.textAlign = 'center';
    ctx.font = 'bold 34px Arial Black';
    ctx.fillStyle = color;
    ctx.fillText('🏁  Voiture ' + name + ' gagne !', W / 2, H / 2 + 10);
    ctx.textAlign = 'left';
}

// ── Stars / confetti ───────────────────────────────────────────────────────
function spawnStars() {
    stars = [];
    for (let i = 0; i < 80; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        stars.push({
            x: W / 2, y: H / 2 - 40,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            size: Math.random() * 7 + 2,
            color: `hsl(${Math.floor(Math.random() * 360)},100%,65%)`,
            life: 1,
            decay: Math.random() * 0.007 + 0.003,
            gravity: 0.12
        });
    }
}

function updateAndDrawStars() {
    for (const s of stars) {
        s.x   += s.vx;
        s.y   += s.vy;
        s.vy  += s.gravity;
        s.life -= s.decay;
        if (s.life <= 0) {
            const angle = Math.random() * Math.PI * 2;
            const spd   = Math.random() * 6 + 2;
            s.x = W / 2; s.y = H / 2 - 60;
            s.vx = Math.cos(angle) * spd;
            s.vy = Math.sin(angle) * spd - 2;
            s.life = 1;
            s.color = `hsl(${Math.floor(Math.random() * 360)},100%,65%)`;
        }
        ctx.globalAlpha = Math.max(0, s.life);
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ── Draw: trophy emoji ─────────────────────────────────────────────────────
function drawTrophy(winner) {
    trophyScale = Math.min(trophyScale + 0.025, 1);
    trophyBob  += 0.04;

    const bob  = Math.sin(trophyBob) * 8;
    const col  = winner === 'blue' ? '#3399ff' : winner === 'red' ? '#ff3333' : '#ffdd00';
    const name = winner === 'blue' ? 'Bleue' : winner === 'red' ? 'Rouge' : 'Égalité';

    ctx.save();
    ctx.translate(W / 2, H / 2 - 80 + bob);
    ctx.scale(trophyScale, trophyScale);
    ctx.font = '110px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏆', 0, 0);
    ctx.restore();
    ctx.textBaseline = 'alphabetic';

    ctx.textAlign = 'center';
    ctx.font = 'bold 46px Arial Black';
    ctx.fillStyle = col;
    ctx.shadowColor = col;
    ctx.shadowBlur = 25;
    if (winner === 'draw')
        ctx.fillText('Égalité !', W / 2, H / 2 + 80);
    else
        ctx.fillText('Voiture ' + name + ' gagne ! 🎉', W / 2, H / 2 + 80);
    ctx.shadowBlur = 0;

    ctx.font = '22px Arial';
    ctx.fillStyle = '#eeeeee';
    ctx.fillText('Score final  :  🔵 ' + scores.blue + '  —  🔴 ' + scores.red, W / 2, H / 2 + 120);
    ctx.textAlign = 'left';
}

// ── Restart button ─────────────────────────────────────────────────────────
const BTN = { x: W / 2 - 115, y: H / 2 + 148, w: 230, h: 52 };

function drawRestartBtn() {
    const grad = ctx.createLinearGradient(BTN.x, BTN.y, BTN.x, BTN.y + BTN.h);
    grad.addColorStop(0, '#00dd77');
    grad.addColorStop(1, '#009944');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.roundRect(BTN.x, BTN.y, BTN.w, BTN.h, 14);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'white';
    ctx.font = 'bold 22px Arial Black';
    ctx.textAlign = 'center';
    ctx.fillText('▶  Recommencer', W / 2, BTN.y + 34);
    ctx.textAlign = 'left';
}

canvas.addEventListener('click', e => {
    if (gameState !== 'gameOver' || !showRestart) return;
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (W / r.width);
    const my = (e.clientY - r.top)  * (H / r.height);
    if (mx >= BTN.x && mx <= BTN.x + BTN.w && my >= BTN.y && my <= BTN.y + BTN.h)
        restartGame();
});
canvas.addEventListener('mousemove', e => {
    if (gameState !== 'gameOver' || !showRestart) { canvas.style.cursor = 'default'; return; }
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (W / r.width);
    const my = (e.clientY - r.top)  * (H / r.height);
    canvas.style.cursor = (mx >= BTN.x && mx <= BTN.x + BTN.w &&
                           my >= BTN.y && my <= BTN.y + BTN.h) ? 'pointer' : 'default';
});

// ── Game flow ──────────────────────────────────────────────────────────────
function startRound() {
    blueCar.reset();
    redCar.reset();
    roundWinner = null;
    gameState   = 'countdown';
    countdown   = 3;
    cdTimer     = 0;
    goShowing   = false;
    goTimer     = 0;
}

function restartGame() {
    scores      = { blue: 0, red: 0 };
    round       = 1;
    showRestart = false;
    trophyScale = 0;
    trophyBob   = 0;
    stars       = [];
    canvas.style.cursor = 'default';
    startRound();
}

// ── Main loop ──────────────────────────────────────────────────────────────
let lastTime = 0;

function loop(ts) {
    const dt = Math.min((ts - lastTime) / 1000, 0.1);
    lastTime  = ts;

    drawTrack();

    if (gameState === 'countdown') {
        blueCar.draw();
        redCar.draw();
        drawHUD();

        if (!goShowing) {
            cdTimer += dt;
            if (cdTimer >= 1) { cdTimer = 0; countdown--; }
            if (countdown <= 0) { goShowing = true; goTimer = 0; }
            else {
                const colors = ['#ff4444', '#ffaa00', '#ffff00'];
                drawCountdown(String(countdown), colors[countdown - 1] || '#ffffff');
            }
        } else {
            goTimer += dt;
            drawCountdown('PARTEZ !', '#00ff88');
            if (goTimer >= 0.75) gameState = 'racing';
        }

    } else if (gameState === 'racing') {
        blueCar.update();
        redCar.update();

        const bFin = blueCar.crossedFinish();
        const rFin = redCar.crossedFinish();

        if (bFin && !roundWinner) { roundWinner = 'blue'; scores.blue++; }
        if (rFin && !roundWinner) { roundWinner = 'red';  scores.red++;  }

        if (roundWinner) { gameState = 'roundEnd'; reTimer = 0; }

        blueCar.draw();
        redCar.draw();
        drawHUD();

    } else if (gameState === 'roundEnd') {
        blueCar.draw();
        redCar.draw();
        drawHUD();
        drawRoundBanner();
        reTimer += dt;
        if (reTimer >= 2.2) {
            if (round >= TOTAL_ROUNDS) {
                gameState     = 'gameOver';
                gameOverTimer = 0;
                showRestart   = false;
                spawnStars();
            } else {
                round++;
                startRound();
            }
        }

    } else if (gameState === 'gameOver') {
        gameOverTimer += dt;

        // Dark overlay
        ctx.fillStyle = 'rgba(0,0,0,0.78)';
        ctx.fillRect(0, 0, W, H);

        updateAndDrawStars();

        const winner = scores.blue > scores.red ? 'blue'
                     : scores.red > scores.blue ? 'red'
                     : 'draw';
        drawTrophy(winner);

        if (gameOverTimer >= 3 && !showRestart) showRestart = true;
        if (showRestart) drawRestartBtn();
    }

    requestAnimationFrame(loop);
}

startRound();
requestAnimationFrame(loop);
</script>
</body>
</html>
