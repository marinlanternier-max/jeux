<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Course de Voitures</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a1a;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Arial Black', Arial, sans-serif;
    overflow: hidden;
}
canvas {
    border: 3px solid #333; border-radius: 8px;
    box-shadow: 0 0 40px rgba(80,120,255,0.25);
    display: block; max-width: 100vw; max-height: 100vh;
}
</style>
</head>
<body>
<canvas id="gameCanvas" width="1200" height="800"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Circuit path (F1-style, non-round) ────────────────────────────────────
// Centerline goes clockwise.  Start = top of right main straight.
const TRACK_W = 88; // road width in pixels

const circuitPath = new Path2D();
circuitPath.moveTo(960, 120);        // A – top of right main straight
circuitPath.lineTo(960, 640);        // B – down right straight  (520 px)
circuitPath.bezierCurveTo(960,720, 920,740, 850,740);   // corner 1: S→W
circuitPath.lineTo(300, 740);        // C – bottom straight       (550 px)
circuitPath.bezierCurveTo(200,740, 180,700, 180,620);   // corner 2: W→N (hairpin feel)
circuitPath.lineTo(180, 190);        // D – left straight         (430 px)
circuitPath.bezierCurveTo(180,105, 230,80, 320,80);     // corner 3: N→E
circuitPath.lineTo(510, 80);         // E – first top section     (190 px)
// chicane (dip south then back north)
circuitPath.bezierCurveTo(545,165, 590,165, 625,80);    // chicane
circuitPath.lineTo(800, 80);         // F – after chicane          (175 px)
circuitPath.bezierCurveTo(920,80, 960,110, 960,120);    // corner 4: E→S (sweep)
circuitPath.closePath();

// ── Track mask (pixel-based collision) ─────────────────────────────────────
const maskCanvas = document.createElement('canvas');
maskCanvas.width = W; maskCanvas.height = H;
const mCtx = maskCanvas.getContext('2d');
mCtx.fillStyle = '#000';
mCtx.fillRect(0, 0, W, H);
mCtx.strokeStyle = '#fff';
mCtx.lineWidth   = TRACK_W;
mCtx.lineCap     = 'round';
mCtx.lineJoin    = 'round';
mCtx.stroke(circuitPath);
const trackData = mCtx.getImageData(0, 0, W, H).data;

function isOnTrack(x, y) {
    const xi = x|0, yi = y|0;
    if (xi < 0 || xi >= W || yi < 0 || yi >= H) return false;
    return trackData[(yi*W + xi)*4] > 128;
}

// ── Finish line (horizontal, on right main straight) ───────────────────────
const FIN_Y  = 260;
const FIN_X1 = 960 - TRACK_W/2 + 2;   // ≈ 916
const FIN_X2 = 960 + TRACK_W/2 - 2;   // ≈ 1004

// Start positions: just south of finish line, facing south (angle = π)
const START_BLUE = { x: 942, y: FIN_Y + 40, angle: Math.PI };
const START_RED  = { x: 978, y: FIN_Y + 80, angle: Math.PI };

// ── Keys ───────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))
        e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ── Car ────────────────────────────────────────────────────────────────────
class Car {
    constructor(sp, color, hi, controls, label) {
        this.startPos = sp; this.color = color; this.hi = hi;
        this.controls = controls; this.label = label; this.reset();
    }
    reset() {
        this.x = this.startPos.x; this.y = this.startPos.y;
        this.angle = this.startPos.angle; this.speed = 0;
        this.prevX = this.x; this.prevY = this.y; this.finished = false;
    }
    update() {
        this.prevX = this.x; this.prevY = this.y;
        const MAX=5.2, ACCEL=0.22, FRIC=0.91, TURN=0.068;
        if      (keys[this.controls.up])   this.speed += ACCEL;
        else if (keys[this.controls.down]) this.speed -= ACCEL*0.85;
        else                               this.speed *= FRIC;
        this.speed = Math.max(-MAX*0.45, Math.min(MAX, this.speed));
        if (Math.abs(this.speed) > 0.08) {
            const dir=Math.sign(this.speed);
            const tf =0.45+0.55*Math.min(Math.abs(this.speed)/MAX,1);
            if (keys[this.controls.left])  this.angle -= TURN*dir*tf;
            if (keys[this.controls.right]) this.angle += TURN*dir*tf;
        }
        const nx = this.x + Math.sin(this.angle)*this.speed;
        const ny = this.y - Math.cos(this.angle)*this.speed;
        if      (isOnTrack(nx,ny))       { this.x=nx; this.y=ny; }
        else if (isOnTrack(nx,this.y))   { this.x=nx; this.speed*=0.65; }
        else if (isOnTrack(this.x,ny))   { this.y=ny; this.speed*=0.65; }
        else                             { this.speed*=-0.25; }
    }
    crossedFinish() {
        if (this.finished) return false;
        if (this.prevY < FIN_Y && this.y >= FIN_Y &&
            this.x >= FIN_X1 && this.x <= FIN_X2) {
            this.finished = true; return true;
        }
        return false;
    }
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        const CW=18, CH=32;
        ctx.fillStyle='rgba(0,0,0,0.28)';
        ctx.beginPath(); ctx.ellipse(3,4,CW/2,CH/2.2,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=this.color;
        ctx.beginPath(); ctx.roundRect(-CW/2,-CH/2,CW,CH,5); ctx.fill();
        ctx.fillStyle=this.hi; ctx.fillRect(-CW/2+4,-CH/2+1,CW-8,CH-2);
        ctx.fillStyle=this.color; ctx.fillRect(-CW/2,-CH/2+8,CW,CH-16);
        ctx.fillStyle='rgba(160,220,255,0.82)';
        ctx.beginPath(); ctx.roundRect(-CW/2+3,-CH/2+4,CW-6,9,2); ctx.fill();
        ctx.fillStyle='rgba(160,220,255,0.55)';
        ctx.beginPath(); ctx.roundRect(-CW/2+3,CH/2-12,CW-6,8,2); ctx.fill();
        ctx.fillStyle='#111';
        [[-CW/2-4,-CH/2+4],[CW/2-1,-CH/2+4],[-CW/2-4,CH/2-12],[CW/2-1,CH/2-12]]
        .forEach(([wx,wy])=>{
            ctx.fillRect(wx,wy,5,8);
            ctx.fillStyle='#444'; ctx.fillRect(wx+1,wy+1,3,6); ctx.fillStyle='#111';
        });
        ctx.restore();
    }
}

const blueCar = new Car(START_BLUE,'#1155ee','#3377ff',
    {up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'},'Bleue (↑↓←→)');
const redCar  = new Car(START_RED,'#cc1111','#ee3333',
    {up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD'},'Rouge (WASD)');

// ── Grandstand helpers (offscreen, drawn once) ─────────────────────────────
const SEAT_PAL = ['#cc2020','#1144cc','#119933','#ccaa00','#882299','#cc6611'];
function specColor(seed) {
    const h=((seed*137)%360+360)%360;
    return `hsl(${h|0},${50+(seed*71)%35|0}%,${42+(seed*53)%22|0}%)`;
}

// Draw a rectangular grandstand block into context c
// rows = number of seat rows; vertical = true means seats stacked left→right
function drawStandBlock(c, x, y, w, h, rows, horiz) {
    // Concrete base
    const g = horiz
        ? c.createLinearGradient(x,y,x,y+h)
        : c.createLinearGradient(x,y,x+w,y);
    g.addColorStop(0,'#525258'); g.addColorStop(1,'#3e3e48');
    c.fillStyle=g; c.fillRect(x,y,w,h);

    const dim = horiz ? h : w;
    const step = dim / rows;

    for (let r=0; r<rows; r++) {
        // position of this row
        const rx = horiz ? x       : x + r*step;
        const ry = horiz ? y+r*step: y;
        const rw = horiz ? w       : step;
        const rh = horiz ? step    : h;

        // shade
        c.fillStyle = r%2===0?'rgba(0,0,0,0.15)':'rgba(255,255,255,0.05)';
        c.fillRect(rx,ry,rw,rh);

        // highlight edge
        c.fillStyle='rgba(255,255,255,0.18)';
        if (horiz) c.fillRect(rx,ry,rw,2);
        else       c.fillRect(rx,ry,2,rh);

        // seat color sections
        const secSize = horiz ? 90 : 90;
        const mainDim  = horiz ? rw : rh;
        for (let s=0; s*secSize<mainDim; s++) {
            const col=SEAT_PAL[(s+r*5)%SEAT_PAL.length];
            c.fillStyle=col; c.globalAlpha=0.45;
            if (horiz) c.fillRect(rx+s*secSize+1,ry+4, Math.min(secSize-2,mainDim-s*secSize-2), rh-8);
            else       c.fillRect(rx+4,ry+s*secSize+1, rw-8, Math.min(secSize-2,mainDim-s*secSize-2));
            c.globalAlpha=1;
        }

        // spectators
        const spacing=11;
        if (horiz) {
            const hy=ry+rh*0.52;
            for (let sx=rx+5; sx<rx+rw-5; sx+=spacing) {
                const seed=(sx*13+r*97)|0;
                c.fillStyle=specColor(seed);
                c.beginPath(); c.ellipse(sx,hy,4,4.5,0,0,Math.PI*2); c.fill();
                c.fillStyle='rgba(255,255,255,0.28)';
                c.beginPath(); c.ellipse(sx-1.2,hy-1.8,1.8,1.5,-0.5,0,Math.PI*2); c.fill();
            }
        } else {
            const hx=rx+rw*0.52;
            for (let sy=ry+5; sy<ry+rh-5; sy+=spacing) {
                const seed=(sy*13+r*97)|0;
                c.fillStyle=specColor(seed);
                c.beginPath(); c.ellipse(hx,sy,4,4.5,0,0,Math.PI*2); c.fill();
                c.fillStyle='rgba(255,255,255,0.28)';
                c.beginPath(); c.ellipse(hx-1.2,sy-1.8,1.8,1.5,-0.5,0,Math.PI*2); c.fill();
            }
        }
    }

    // border
    c.strokeStyle='#1a1a22'; c.lineWidth=2; c.strokeRect(x,y,w,h);

    // canopy
    c.fillStyle='#1a1a26';
    if (horiz) c.fillRect(x,y,w,10);
    else       c.fillRect(x,y,10,h);
    c.fillStyle='rgba(255,255,255,0.08)';
    if (horiz) c.fillRect(x,y+10,w,3);
    else       c.fillRect(x+10,y,3,h);
}

const standCanvas = document.createElement('canvas');
standCanvas.width=W; standCanvas.height=H;
(function buildStands(){
    const sc=standCanvas.getContext('2d');
    // Right side of main straight (x: 1008→1110, y: 100→660)
    drawStandBlock(sc,1008,100,102,560, 5, true);
    // Label
    sc.save(); sc.translate(1060,380); sc.rotate(Math.PI/2);
    sc.fillStyle='rgba(255,255,255,0.55)'; sc.font='bold 13px Arial'; sc.textAlign='center';
    sc.fillText('TRIBUNES PRINCIPALE',0,0); sc.restore();

    // Top grandstand (y: 0→72, x: 100→810) — above the top section
    drawStandBlock(sc,100,0,710,72, 3, true);
    sc.fillStyle='rgba(255,255,255,0.55)'; sc.font='bold 13px Arial'; sc.textAlign='center';
    sc.fillText('TRIBUNES NORD',455,44);

    // Left side grandstand (x: 0→172, y: 160→660)
    drawStandBlock(sc,0,160,172,500, 4, false);
    sc.save(); sc.translate(86,410); sc.rotate(-Math.PI/2);
    sc.fillStyle='rgba(255,255,255,0.55)'; sc.font='bold 13px Arial'; sc.textAlign='center';
    sc.fillText('TRIBUNES OUEST',0,0); sc.restore();

    // Bottom grandstand (y: 758→800, x: 140→900)
    drawStandBlock(sc,140,758,760,40, 2, true);
    sc.fillStyle='rgba(255,255,255,0.55)'; sc.font='bold 13px Arial'; sc.textAlign='center';
    sc.fillText('TRIBUNES SUD',520,785);
})();

// ── Track rendering ─────────────────────────────────────────────────────────
// Pre-render track to offscreen for speed
const trackCanvas = document.createElement('canvas');
trackCanvas.width=W; trackCanvas.height=H;
(function buildTrack(){
    const tc = trackCanvas.getContext('2d');

    // 1. Outer grass
    const g1=tc.createRadialGradient(600,400,100,600,400,750);
    g1.addColorStop(0,'#3c8235'); g1.addColorStop(1,'#254f1e');
    tc.fillStyle=g1; tc.fillRect(0,0,W,H);

    // 2. Blit stands
    tc.drawImage(standCanvas,0,0);

    // 3. Road (double-width stroke then fill interior = "stroke-then-fill" trick)
    tc.strokeStyle='#484848';
    tc.lineWidth  = TRACK_W*2;
    tc.lineCap    = 'round';
    tc.lineJoin   = 'round';
    tc.stroke(circuitPath);

    // 4. Inner infield grass over the road interior
    const g2=tc.createRadialGradient(520,420,50,520,420,500);
    g2.addColorStop(0,'#47943d'); g2.addColorStop(1,'#2d5e25');
    tc.fillStyle=g2;
    tc.fill(circuitPath);

    // 5. Outer kerb (red-white dash on outer edge of road)
    tc.strokeStyle='#cc2222';
    tc.lineWidth=4;
    tc.setLineDash([20,20]);
    tc.lineCap='butt';
    // trick: stroke at TRACK_W + extra so it lands right at the outer edge
    tc.lineWidth = TRACK_W * 2 + 8;
    tc.stroke(circuitPath);
    tc.setLineDash([]);

    // 6. Road surface re-draw (kerb was on top; re-draw road)
    tc.strokeStyle='#484848';
    tc.lineWidth = TRACK_W * 2 - 8;
    tc.lineCap='round'; tc.lineJoin='round';
    tc.stroke(circuitPath);

    // 7. Inner kerb (at inner edge of road)
    tc.strokeStyle='#cc2222';
    tc.lineWidth=4;
    tc.setLineDash([20,20]);
    // stroke just barely narrower than TRACK_W so it appears at inner edge
    tc.lineWidth=6;
    tc.stroke(circuitPath);
    // ... actually let me just do it simply:
    // redraw inner grass to clip inner kerb visual - skip complex kerb, add later

    // 8. Re-fill infield (clean)
    tc.setLineDash([]);
    tc.fillStyle=g2; tc.fill(circuitPath);

    // 9. Inner infield logo
    tc.textAlign='center';
    tc.font='bold 30px Arial Black'; tc.fillStyle='rgba(255,255,255,0.09)';
    tc.fillText('GRAND PRIX',560,390);
    tc.font='16px Arial'; tc.fillStyle='rgba(255,255,255,0.07)';
    tc.fillText('★  COURSE DE VOITURES  ★',560,420);
    tc.textAlign='left';

    // 10. Center dashed dividing line
    tc.strokeStyle='rgba(255,255,255,0.22)';
    tc.lineWidth=2;
    tc.setLineDash([22,22]);
    tc.stroke(circuitPath);
    tc.setLineDash([]);

    // 11. Outer kerb (clean red-white stripes on outer road edge)
    tc.save();
    tc.strokeStyle='#bb2222';
    tc.lineWidth=6; tc.setLineDash([22,22]);
    const outerKerb = new Path2D();
    // We approximate the outer edge by stroking the centerline with very wide line
    // then re-drawing narrower — instead just draw the dashed line at TRACK_W width
    tc.lineWidth = TRACK_W*2 + 10;
    tc.stroke(circuitPath);
    // Then redraw road on top to hide all but the outer few pixels
    tc.setLineDash([]);
    tc.strokeStyle='#484848';
    tc.lineWidth = TRACK_W*2 + 2;
    tc.stroke(circuitPath);
    tc.restore();

    // 12. Final inner kerb pass
    tc.save();
    tc.strokeStyle='#bb2222'; tc.lineWidth=8; tc.setLineDash([22,22]);
    tc.stroke(circuitPath);
    tc.setLineDash([]);
    // Re-fill infield again to clean
    tc.fillStyle=g2; tc.fill(circuitPath);
    tc.restore();

    // 13. Finish line (horizontal checkered band at FIN_Y, x: FIN_X1 to FIN_X2)
    const sq=10;
    for (let x2=FIN_X1; x2<FIN_X2; x2+=sq) {
        for (let row=0; row<2; row++) {
            const col=((x2-FIN_X1)/sq|0+row)%2===0?'white':'black';
            tc.fillStyle=col;
            tc.fillRect(x2, FIN_Y-sq+row*sq, Math.min(sq,FIN_X2-x2), sq);
        }
    }
    // Label
    tc.save();
    tc.translate(FIN_X2+14,(FIN_Y-sq+FIN_Y)/2);
    tc.rotate(Math.PI/2);
    tc.fillStyle='white'; tc.font='bold 11px Arial'; tc.textAlign='center';
    tc.fillText('DÉPART / ARRIVÉE',0,4);
    tc.restore();
})();

function drawTrack() { ctx.drawImage(trackCanvas,0,0); }

// ── HUD ─────────────────────────────────────────────────────────────────────
function roundedBox(x,y,w,h,r,fill,alpha=0.7){
    ctx.fillStyle=fill; ctx.globalAlpha=alpha;
    ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); ctx.globalAlpha=1;
}
function drawHUD(){
    roundedBox(8,8,195,62,10,'#001133');
    ctx.fillStyle='#4488ff'; ctx.font='bold 13px Arial'; ctx.textAlign='left';
    ctx.fillText('🔵  '+blueCar.label,18,28);
    ctx.font='bold 32px Arial Black'; ctx.fillStyle='#fff';
    ctx.fillText(scores.blue+' pt'+(scores.blue!==1?'s':''),22,60);

    roundedBox(W-203,8,195,62,10,'#1a0000');
    ctx.fillStyle='#ff4444'; ctx.font='bold 13px Arial'; ctx.textAlign='right';
    ctx.fillText(redCar.label+'  🔴',W-18,28);
    ctx.font='bold 32px Arial Black'; ctx.fillStyle='#fff'; ctx.textAlign='right';
    ctx.fillText(scores.red+' pt'+(scores.red!==1?'s':''),W-22,60);
    ctx.textAlign='left';

    roundedBox(W/2-90,8,180,42,10,'#0a0a22');
    ctx.fillStyle='#ccccff'; ctx.font='bold 18px Arial'; ctx.textAlign='center';
    ctx.fillText('Manche  '+round+' / '+TOTAL_ROUNDS,W/2,34); ctx.textAlign='left';
}

// ── Countdown ───────────────────────────────────────────────────────────────
function drawCountdown(text,color){
    ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.font='bold 130px Arial Black';
    ctx.shadowColor=color; ctx.shadowBlur=40; ctx.fillStyle=color;
    ctx.fillText(text,W/2,H/2+50); ctx.shadowBlur=0; ctx.textAlign='left';
}

// ── Round banner ─────────────────────────────────────────────────────────────
function drawRoundBanner(){
    if (!roundWinner) return;
    const color=roundWinner==='blue'?'#3399ff':'#ff3333';
    const name =roundWinner==='blue'?'Bleue':'Rouge';
    roundedBox(W/2-220,H/2-40,440,80,16,'#000',0.65);
    ctx.textAlign='center'; ctx.font='bold 34px Arial Black'; ctx.fillStyle=color;
    ctx.fillText('🏁  Voiture '+name+' gagne !',W/2,H/2+10); ctx.textAlign='left';
}

// ── Confetti ──────────────────────────────────────────────────────────────────
let stars=[];
function spawnStars(){
    stars=[];
    for(let i=0;i<80;i++){
        const a=Math.random()*Math.PI*2,sp=Math.random()*6+2;
        stars.push({x:W/2,y:H/2-40,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,
            size:Math.random()*7+2,color:`hsl(${Math.random()*360|0},100%,65%)`,
            life:1,decay:Math.random()*0.007+0.003,gravity:0.12});
    }
}
function updateAndDrawStars(){
    for(const s of stars){
        s.x+=s.vx;s.y+=s.vy;s.vy+=s.gravity;s.life-=s.decay;
        if(s.life<=0){
            const a=Math.random()*Math.PI*2,sp=Math.random()*6+2;
            s.x=W/2;s.y=H/2-60;s.vx=Math.cos(a)*sp;s.vy=Math.sin(a)*sp-2;
            s.life=1;s.color=`hsl(${Math.random()*360|0},100%,65%)`;
        }
        ctx.globalAlpha=Math.max(0,s.life);
        ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.size*s.life,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
}

// ── Trophy ────────────────────────────────────────────────────────────────────
let trophyBob=0,trophyScale=0;
function drawTrophy(winner){
    trophyScale=Math.min(trophyScale+0.025,1);trophyBob+=0.04;
    const bob=Math.sin(trophyBob)*8;
    const col=winner==='blue'?'#3399ff':winner==='red'?'#ff3333':'#ffdd00';
    const name=winner==='blue'?'Bleue':winner==='red'?'Rouge':'Égalité';
    ctx.save();ctx.translate(W/2,H/2-80+bob);ctx.scale(trophyScale,trophyScale);
    ctx.font='110px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🏆',0,0);ctx.restore();ctx.textBaseline='alphabetic';
    ctx.textAlign='center';ctx.font='bold 46px Arial Black';
    ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=25;
    ctx.fillText(winner==='draw'?'Égalité !':'Voiture '+name+' gagne ! 🎉',W/2,H/2+80);
    ctx.shadowBlur=0;ctx.font='22px Arial';ctx.fillStyle='#eee';
    ctx.fillText('Score final  :  🔵 '+scores.blue+'  —  🔴 '+scores.red,W/2,H/2+120);
    ctx.textAlign='left';
}

// ── Restart button ────────────────────────────────────────────────────────────
const BTN={x:W/2-115,y:H/2+148,w:230,h:52};
function drawRestartBtn(){
    const g=ctx.createLinearGradient(BTN.x,BTN.y,BTN.x,BTN.y+BTN.h);
    g.addColorStop(0,'#00dd77');g.addColorStop(1,'#009944');
    ctx.fillStyle=g;ctx.shadowColor='#00ff88';ctx.shadowBlur=18;
    ctx.beginPath();ctx.roundRect(BTN.x,BTN.y,BTN.w,BTN.h,14);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='white';ctx.font='bold 22px Arial Black';
    ctx.textAlign='center';ctx.fillText('▶  Recommencer',W/2,BTN.y+34);ctx.textAlign='left';
}
canvas.addEventListener('click',e=>{
    if(gameState!=='gameOver'||!showRestart)return;
    const r=canvas.getBoundingClientRect();
    const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
    if(mx>=BTN.x&&mx<=BTN.x+BTN.w&&my>=BTN.y&&my<=BTN.y+BTN.h)restartGame();
});
canvas.addEventListener('mousemove',e=>{
    if(gameState!=='gameOver'||!showRestart){canvas.style.cursor='default';return;}
    const r=canvas.getBoundingClientRect();
    const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
    canvas.style.cursor=(mx>=BTN.x&&mx<=BTN.x+BTN.w&&my>=BTN.y&&my<=BTN.y+BTN.h)?'pointer':'default';
});

// ── Game state ────────────────────────────────────────────────────────────────
const TOTAL_ROUNDS=10;
let round=1,scores={blue:0,red:0},gameState='countdown';
let countdown=3,cdTimer=0,roundWinner=null,reTimer=0;
let goTimer=0,goShowing=false,gameOverTimer=0,showRestart=false;

function startRound(){
    blueCar.reset();redCar.reset();roundWinner=null;
    gameState='countdown';countdown=3;cdTimer=0;goShowing=false;goTimer=0;
}
function restartGame(){
    scores={blue:0,red:0};round=1;showRestart=false;
    trophyScale=0;trophyBob=0;stars=[];canvas.style.cursor='default';startRound();
}

// ── Main loop ─────────────────────────────────────────────────────────────────
let lastTime=0;
function loop(ts){
    const dt=Math.min((ts-lastTime)/1000,0.1);lastTime=ts;
    drawTrack();

    if(gameState==='countdown'){
        blueCar.draw();redCar.draw();drawHUD();
        if(!goShowing){
            cdTimer+=dt;if(cdTimer>=1){cdTimer=0;countdown--;}
            if(countdown<=0){goShowing=true;goTimer=0;}
            else{const cs=['#ff4444','#ffaa00','#ffff00'];drawCountdown(String(countdown),cs[countdown-1]||'#fff');}
        } else {
            goTimer+=dt;drawCountdown('PARTEZ !','#00ff88');
            if(goTimer>=0.75)gameState='racing';
        }
    } else if(gameState==='racing'){
        blueCar.update();redCar.update();
        const bF=blueCar.crossedFinish(),rF=redCar.crossedFinish();
        if(bF&&!roundWinner){roundWinner='blue';scores.blue++;}
        if(rF&&!roundWinner){roundWinner='red'; scores.red++; }
        if(roundWinner){gameState='roundEnd';reTimer=0;}
        blueCar.draw();redCar.draw();drawHUD();
    } else if(gameState==='roundEnd'){
        blueCar.draw();redCar.draw();drawHUD();drawRoundBanner();
        reTimer+=dt;
        if(reTimer>=2.2){
            if(round>=TOTAL_ROUNDS){gameState='gameOver';gameOverTimer=0;showRestart=false;spawnStars();}
            else{round++;startRound();}
        }
    } else if(gameState==='gameOver'){
        gameOverTimer+=dt;
        ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);
        updateAndDrawStars();
        const winner=scores.blue>scores.red?'blue':scores.red>scores.blue?'red':'draw';
        drawTrophy(winner);
        if(gameOverTimer>=3&&!showRestart)showRestart=true;
        if(showRestart)drawRestartBtn();
    }
    requestAnimationFrame(loop);
}

startRound();
requestAnimationFrame(loop);
</script>
