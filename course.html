<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Course de Voitures</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a1a;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Arial Black', Arial, sans-serif;
    overflow: hidden;
}
canvas {
    border: 3px solid #333; border-radius: 8px;
    box-shadow: 0 0 40px rgba(80,120,255,0.25);
    display: block; max-width: 100vw; max-height: 100vh;
}
</style>
</head>
<body>
<canvas id="gameCanvas" width="1200" height="800"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ════════════════════════════════════════════════════════════
//  CIRCUIT GEOMETRY
//  Centerline of the road — the track mask is stroked at
//  exactly TRACK_W to give the driveable strip.
// ════════════════════════════════════════════════════════════
const TRACK_W = 120;           // road width in pixels
const HALF_W  = TRACK_W / 2;  // 36 px from centre to edge

//  Key x / y of the four "arms"
const RX = 1000;   // centre-x of the right main straight
const BX = 120;    // centre-x of the left straight
const TY = 110;    // centre-y of the top straights
const BY = 700;    // centre-y of the bottom straight

//  Derived road edges (used for grandstand placement & finish line)
const RIGHT_OUTER = RX + HALF_W;   // 1036
const LEFT_OUTER  = BX - HALF_W;   //   84
const TOP_OUTER   = TY - HALF_W;   //   74
const BOT_OUTER   = BY + HALF_W;   //  736

// Finish line: horizontal strip across the right main straight
const FIN_Y  = 255;
const FIN_X1 = RX - HALF_W + 2;   // ≈ 966
const FIN_X2 = RX + HALF_W - 2;   // ≈ 1034

// Car start positions (south of finish, heading south = angle π)
const START_BLUE = { x: RX - 18, y: FIN_Y + 45, angle: Math.PI };
const START_RED  = { x: RX + 18, y: FIN_Y + 90, angle: Math.PI };

// The circuit path (clockwise, closed)
const circuitPath = (function () {
    const p = new Path2D();
    p.moveTo(RX,  140);             // A  top of main straight

    // ① Right main straight → south  (500 px)
    p.lineTo(RX,  640);             // B

    // ② Corner bottom-right  S → W  (sweeping)
    p.bezierCurveTo(RX, BY,  960, BY,  890, BY);

    // ③ Bottom straight → west  (≈ 740 px)
    p.lineTo(155, BY);              // C

    // ④ Corner bottom-left   W → N  (tight)
    p.bezierCurveTo(BX, BY,  BX, 670,  BX, 620);

    // ⑤ Left straight → north  (≈ 450 px)
    p.lineTo(BX,  170);             // D

    // ⑥ Corner top-left   N → E
    p.bezierCurveTo(BX, TY,  165, TY,  215, TY);

    // ⑦ Top-left section → east  (240 px)
    p.lineTo(455, TY);              // E

    // ⑧ Chicane (dips south then back)
    p.bezierCurveTo(492, 200,  548, 200,  585, TY);

    // ⑨ Top-right section → east  (260 px)
    p.lineTo(860, TY);              // F

    // ⑩ Corner top-right  E → S  (sweeping back to start)
    p.bezierCurveTo(990, TY,  RX, TY,  RX, 140);

    p.closePath();
    return p;
})();

// ════════════════════════════════════════════════════════════
//  TRACK MASK  (white = driveable; built once)
// ════════════════════════════════════════════════════════════
const maskCvs  = document.createElement('canvas');
maskCvs.width  = W; maskCvs.height = H;
const mCtx     = maskCvs.getContext('2d');
mCtx.fillStyle = '#000'; mCtx.fillRect(0,0,W,H);
mCtx.strokeStyle = '#fff';
mCtx.lineWidth   = TRACK_W;
mCtx.lineCap     = 'round'; mCtx.lineJoin = 'round';
mCtx.stroke(circuitPath);
const MASK = mCtx.getImageData(0,0,W,H).data;

function isOnTrack(x, y) {
    const xi = x|0, yi = y|0;
    if (xi<0||xi>=W||yi<0||yi>=H) return false;
    return MASK[(yi*W+xi)*4] > 128;
}

// ════════════════════════════════════════════════════════════
//  KEYS
// ════════════════════════════════════════════════════════════
const keys = {};
const lastKeyTime = {};  // for double-press detection
const boostKeys = {};    // which car's boost key was just double-pressed

window.addEventListener('keydown', e => {
    if (keys[e.code]) return; // already held, ignore repeat
    keys[e.code] = true;
    const now = performance.now();
    if (lastKeyTime[e.code] && now - lastKeyTime[e.code] < 300) {
        boostKeys[e.code] = true;
    }
    lastKeyTime[e.code] = now;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))
        e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const TRAIL_COLORS = ['#ff0000','#ff7700','#ffff00','#00ff00','#00ccff','#aa00ff','#ff00aa'];

// ════════════════════════════════════════════════════════════
//  CAR
// ════════════════════════════════════════════════════════════
class Car {
    constructor(sp, color, hi, controls, label) {
        this.startPos=sp; this.color=color; this.hi=hi;
        this.controls=controls; this.label=label; this.reset();
    }
    reset() {
        this.x=this.startPos.x; this.y=this.startPos.y;
        this.angle=this.startPos.angle; this.speed=0;
        this.prevX=this.x; this.prevY=this.y; this.finished=false;
        this.boostTimer=0; this.boostFuel=5; this.trail=[];
    }
    update() {
        this.prevX=this.x; this.prevY=this.y;
        // consume double-press boost trigger
        if (boostKeys[this.controls.up]) { if(this.boostFuel>0) this.boostTimer=Math.min(this.boostFuel,1.8); boostKeys[this.controls.up]=false; }
        if (this.boostTimer>0) { this.boostTimer-=1/60; this.boostFuel=Math.max(0,this.boostFuel-1/60); }
        const boosting=this.boostTimer>0;
        const MAX=boosting?9.5:5.2, ACCEL=boosting?0.38:0.22, FRIC=0.91, TURN=0.068;
        if      (keys[this.controls.up])   this.speed+=ACCEL;
        else if (keys[this.controls.down]) this.speed-=ACCEL*0.85;
        else                               this.speed*=FRIC;
        this.speed=Math.max(-MAX*0.45,Math.min(MAX,this.speed));
        if (Math.abs(this.speed)>0.08) {
            const dir=Math.sign(this.speed);
            const tf=0.45+0.55*Math.min(Math.abs(this.speed)/MAX,1);
            if (keys[this.controls.left])  this.angle-=TURN*dir*tf;
            if (keys[this.controls.right]) this.angle+=TURN*dir*tf;
        }
        const nx=this.x+Math.sin(this.angle)*this.speed;
        const ny=this.y-Math.cos(this.angle)*this.speed;
        if      (isOnTrack(nx,ny))     {this.x=nx;this.y=ny;}
        else if (isOnTrack(nx,this.y)) {this.x=nx;this.speed*=0.65;}
        else if (isOnTrack(this.x,ny)) {this.y=ny;this.speed*=0.65;}
        else                           {this.speed*=-0.25;}
        // trail
        if (boosting) {
            this.trail.push({x:this.x,y:this.y,life:1,
                color:TRAIL_COLORS[Math.floor(performance.now()/60)%TRAIL_COLORS.length]});
        }
        for (const p of this.trail) p.life-=0.045;
        this.trail=this.trail.filter(p=>p.life>0);
    }
    crossedFinish() {
        if (this.finished) return false;
        if (this.prevY < FIN_Y && this.y >= FIN_Y &&
            this.x >= FIN_X1 && this.x <= FIN_X2) {
            this.finished=true; return true;
        }
        return false;
    }
    drawTrail() {
        for (const p of this.trail) {
            ctx.globalAlpha=p.life*0.7;
            ctx.fillStyle=p.color;
            ctx.beginPath(); ctx.arc(p.x,p.y,7*p.life,0,Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha=1;
    }
    draw() {
        // boost glow ring
        if (this.boostTimer>0) {
            ctx.save(); ctx.translate(this.x,this.y);
            const glow=ctx.createRadialGradient(0,0,4,0,0,28);
            const hue=(performance.now()/5)%360;
            glow.addColorStop(0,`hsla(${hue|0},100%,70%,0.7)`);
            glow.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,0,28,0,Math.PI*2); ctx.fill();
            ctx.restore();
        }
        ctx.save();
        ctx.translate(this.x,this.y); ctx.rotate(this.angle);
        const CW=18,CH=32;
        ctx.fillStyle='rgba(0,0,0,0.28)';
        ctx.beginPath(); ctx.ellipse(3,4,CW/2,CH/2.2,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=this.color;
        ctx.beginPath(); ctx.roundRect(-CW/2,-CH/2,CW,CH,5); ctx.fill();
        ctx.fillStyle=this.hi;   ctx.fillRect(-CW/2+4,-CH/2+1,CW-8,CH-2);
        ctx.fillStyle=this.color;ctx.fillRect(-CW/2,-CH/2+8,CW,CH-16);
        ctx.fillStyle='rgba(160,220,255,0.82)';
        ctx.beginPath(); ctx.roundRect(-CW/2+3,-CH/2+4,CW-6,9,2); ctx.fill();
        ctx.fillStyle='rgba(160,220,255,0.55)';
        ctx.beginPath(); ctx.roundRect(-CW/2+3,CH/2-12,CW-6,8,2); ctx.fill();
        ctx.fillStyle='#111';
        [[-CW/2-4,-CH/2+4],[CW/2-1,-CH/2+4],
         [-CW/2-4, CH/2-12],[CW/2-1, CH/2-12]].forEach(([wx,wy])=>{
            ctx.fillRect(wx,wy,5,8);
            ctx.fillStyle='#444'; ctx.fillRect(wx+1,wy+1,3,6); ctx.fillStyle='#111';
        });
        ctx.restore();
    }
}

const blueCar=new Car(START_BLUE,'#1155ee','#3377ff',
    {up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'},'Bleue (↑↓←→)');
const redCar =new Car(START_RED, '#cc1111','#ee3333',
    {up:'KeyW',down:'KeyS',left:'KeyA',right:'KeyD'},'Rouge (WASD)');

// ════════════════════════════════════════════════════════════
//  GRANDSTANDS  (drawn once to an offscreen canvas)
// ════════════════════════════════════════════════════════════
const SEAT_PAL=['#cc2020','#1144cc','#119933','#ccaa00','#882299','#cc6611'];

function specColor(seed) {
    const h=((seed*137)%360+360)%360;
    return `hsl(${h|0},${50+(seed*71)%35|0}%,${42+(seed*53)%22|0}%)`;
}

// Draw a grandstand block.
// horiz=true  → tiers stacked top→bottom  (for top/bottom stands)
// horiz=false → tiers stacked left→right  (for left/right stands)
function drawStand(c, x, y, w, h, tiers, horiz) {
    // Concrete base
    const bg=horiz ? c.createLinearGradient(x,y,x,y+h) : c.createLinearGradient(x,y,x+w,y);
    bg.addColorStop(0,'#525258'); bg.addColorStop(1,'#3e3e48');
    c.fillStyle=bg; c.fillRect(x,y,w,h);

    const dim  = horiz ? h : w;
    const step = dim / tiers;

    for (let r=0; r<tiers; r++) {
        const rx = horiz ? x       : x+r*step;
        const ry = horiz ? y+r*step: y;
        const rw = horiz ? w       : step;
        const rh = horiz ? step    : h;

        // tier shading
        c.fillStyle=r%2===0?'rgba(0,0,0,0.15)':'rgba(255,255,255,0.05)';
        c.fillRect(rx,ry,rw,rh);

        // tier inner-edge highlight
        c.fillStyle='rgba(255,255,255,0.2)';
        if (horiz) c.fillRect(rx,ry,rw,2);
        else       c.fillRect(rx,ry,2,rh);

        // coloured seat sections
        const sec=85;
        const main=horiz?rw:rh;
        for (let s=0;s*sec<main;s++) {
            c.fillStyle=SEAT_PAL[(s+r*5)%SEAT_PAL.length];
            c.globalAlpha=0.45;
            if (horiz) c.fillRect(rx+s*sec+1,ry+4, Math.min(sec-2,main-s*sec-2), rh-8);
            else       c.fillRect(rx+4,ry+s*sec+1, rw-8, Math.min(sec-2,main-s*sec-2));
            c.globalAlpha=1;
        }

        // spectator heads
        if (horiz) {
            const hy=ry+rh*0.52;
            for (let sx=rx+6;sx<rx+rw-6;sx+=11) {
                const seed=(sx*13+r*97)|0;
                c.fillStyle=specColor(seed);
                c.beginPath(); c.ellipse(sx,hy,4,4.5,0,0,Math.PI*2); c.fill();
                c.fillStyle='rgba(255,255,255,0.28)';
                c.beginPath(); c.ellipse(sx-1.2,hy-1.8,1.8,1.5,-0.5,0,Math.PI*2); c.fill();
            }
        } else {
            const hx=rx+rw*0.52;
            for (let sy=ry+6;sy<ry+rh-6;sy+=11) {
                const seed=(sy*13+r*97)|0;
                c.fillStyle=specColor(seed);
                c.beginPath(); c.ellipse(hx,sy,4,4.5,0,0,Math.PI*2); c.fill();
                c.fillStyle='rgba(255,255,255,0.28)';
                c.beginPath(); c.ellipse(hx-1.2,sy-1.8,1.8,1.5,-0.5,0,Math.PI*2); c.fill();
            }
        }
    }

    // border + canopy
    c.strokeStyle='#1a1a22'; c.lineWidth=2; c.strokeRect(x,y,w,h);
    c.fillStyle='#191924';
    if (horiz) c.fillRect(x,y,w,10);
    else       c.fillRect(x,y,10,h);
    c.fillStyle='rgba(255,255,255,0.09)';
    if (horiz) c.fillRect(x,y+10,w,3);
    else       c.fillRect(x+10,y,3,h);
}

function standLabel(c, text, x, y, angle) {
    c.save();
    c.translate(x,y); if (angle) c.rotate(angle);
    c.fillStyle='rgba(255,255,255,0.6)';
    c.font='bold 13px Arial'; c.textAlign='center';
    c.fillText(text,0,0); c.restore();
}

const standCvs=document.createElement('canvas');
standCvs.width=W; standCvs.height=H;
(function(){
    const sc=standCvs.getContext('2d');

    // ── Right stand (alongside main straight, tiers go left→right away from track)
    //    x: RIGHT_OUTER+4 to 1196   y: 130 to 650
    const RsX=RIGHT_OUTER+4, RsY=130, RsW=W-RsX-4, RsH=520;
    drawStand(sc, RsX,RsY, RsW,RsH, 5, false);
    standLabel(sc,'TRIBUNES PRINCIPALE', RsX+RsW/2, RsY+RsH/2, Math.PI/2);

    // ── Top stand (above top straights, tiers go top→bottom toward track)
    //    x: 200 to 880  y: 0 to TOP_OUTER-4
    const TsX=200, TsY=0, TsW=680, TsH=TOP_OUTER-4;
    drawStand(sc, TsX,TsY, TsW,TsH, 3, true);
    standLabel(sc,'TRIBUNES NORD', TsX+TsW/2, TsY+TsH/2);

    // ── Left stand (alongside left straight, tiers go right→left away from track)
    //    x: 0 to LEFT_OUTER-4   y: 165 to 635
    const LsX=0, LsY=165, LsW=LEFT_OUTER-4, LsH=470;
    drawStand(sc, LsX,LsY, LsW,LsH, 4, false);
    standLabel(sc,'TRIBUNES OUEST', LsX+LsW/2, LsY+LsH/2, -Math.PI/2);

    // ── Bottom stand (below bottom straight, tiers go bottom→top toward track)
    //    x: 155 to 900   y: BOT_OUTER+4 to 798
    const BsX=155, BsY=BOT_OUTER+4, BsW=745, BsH=H-BsY-2;
    drawStand(sc, BsX,BsY, BsW,BsH, 3, true);
    standLabel(sc,'TRIBUNES SUD', BsX+BsW/2, BsY+BsH/2);
})();

// ════════════════════════════════════════════════════════════
//  TRACK CANVAS  (pre-rendered every game start, reused each frame)
// ════════════════════════════════════════════════════════════
const trackCvs=document.createElement('canvas');
trackCvs.width=W; trackCvs.height=H;
(function(){
    const tc=trackCvs.getContext('2d');

    // 1. Outer grass
    const g1=tc.createRadialGradient(550,400,80,550,400,750);
    g1.addColorStop(0,'#3c8235'); g1.addColorStop(1,'#254f1e');
    tc.fillStyle=g1; tc.fillRect(0,0,W,H);

    // 2. Infield grass (fill interior of closed circuit path first)
    const g2=tc.createRadialGradient(520,380,40,520,380,520);
    g2.addColorStop(0,'#47943d'); g2.addColorStop(1,'#2d5e25');
    tc.fillStyle=g2; tc.fill(circuitPath);

    // 3. Stands (drawn outside road area, safe to blit before road)
    tc.drawImage(standCvs,0,0);

    // 4. Road — use the mask canvas to stamp road colour only where the road is
    //    technique: draw road onto a temp canvas, then mask it with maskCvs
    const tmp=document.createElement('canvas'); tmp.width=W; tmp.height=H;
    const tc2=tmp.getContext('2d');

    // outer kerb stripe (slightly wider than road, red-white dashes)
    tc2.strokeStyle='#bb2222';
    tc2.lineWidth=TRACK_W+10; tc2.lineCap='round'; tc2.lineJoin='round';
    tc2.setLineDash([20,20]); tc2.stroke(circuitPath); tc2.setLineDash([]);

    // road asphalt
    tc2.strokeStyle='#484848'; tc2.lineWidth=TRACK_W;
    tc2.stroke(circuitPath);

    // inner kerb (thin dashes directly on path centre → sits at inner road edge after masking)
    tc2.strokeStyle='#bb2222'; tc2.lineWidth=6;
    tc2.setLineDash([20,20]); tc2.stroke(circuitPath); tc2.setLineDash([]);

    // centre dashed lane divider
    tc2.strokeStyle='rgba(255,255,255,0.22)'; tc2.lineWidth=2;
    tc2.setLineDash([22,22]); tc2.stroke(circuitPath); tc2.setLineDash([]);

    // mask: keep only the road pixels
    tc2.globalCompositeOperation='destination-in';
    tc2.drawImage(maskCvs,0,0);

    // stamp onto main track canvas
    tc.drawImage(tmp,0,0);

    // 5. Infield decorations (on top so text sits in the grass)
    tc.textAlign='center';
    tc.font='bold 30px Arial Black'; tc.fillStyle='rgba(255,255,255,0.09)';
    tc.fillText('GRAND PRIX',510,380);
    tc.font='16px Arial'; tc.fillStyle='rgba(255,255,255,0.07)';
    tc.fillText('★  COURSE DE VOITURES  ★',510,410);
    tc.textAlign='left';

    // 6. Finish / start line — horizontal checkered band across the main straight
    //    centred on FIN_Y, 3 rows of 10 px squares spanning FIN_X1→FIN_X2
    const sq=10;
    const linesY=FIN_Y-15;  // top of checkered band
    for (let xx=FIN_X1; xx<FIN_X2; xx+=sq) {
        for (let row=0; row<3; row++) {
            tc.fillStyle=((xx-FIN_X1)/sq|0+row)%2===0?'#fff':'#000';
            tc.fillRect(xx, linesY+row*sq, Math.min(sq,FIN_X2-xx), sq);
        }
    }
    // label to the right of the finish line
    tc.save();
    tc.translate(FIN_X2+14, FIN_Y+2); tc.rotate(Math.PI/2);
    tc.fillStyle='white'; tc.font='bold 11px Arial'; tc.textAlign='center';
    tc.fillText('DÉPART / ARRIVÉE',0,4); tc.restore();
})();

function drawTrack() { ctx.drawImage(trackCvs,0,0); }

// ════════════════════════════════════════════════════════════
//  HUD
// ════════════════════════════════════════════════════════════
function rBox(x,y,w,h,r,fill,a=0.7){
    ctx.fillStyle=fill; ctx.globalAlpha=a;
    ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); ctx.globalAlpha=1;
}
function drawHUD(){
    rBox(8,8,195,75,10,'#001133');
    ctx.fillStyle='#4488ff'; ctx.font='bold 13px Arial'; ctx.textAlign='left';
    ctx.fillText('🔵  '+blueCar.label,18,28);
    ctx.font='bold 32px Arial Black'; ctx.fillStyle='#fff';
    ctx.fillText(scores.blue+' pt'+(scores.blue!==1?'s':''),22,60);
    // boost bar blue
    ctx.fillStyle='#223'; ctx.fillRect(18,66,160,7);
    const bf=blueCar.boostFuel/5;
    const bg=ctx.createLinearGradient(18,0,178,0);
    bg.addColorStop(0,'#ff0'); bg.addColorStop(0.5,'#0f0'); bg.addColorStop(1,'#0cf');
    ctx.fillStyle=bg; ctx.fillRect(18,66,160*bf,7);
    ctx.strokeStyle='#446'; ctx.lineWidth=1; ctx.strokeRect(18,66,160,7);
    ctx.font='9px Arial'; ctx.fillStyle='#aaa'; ctx.fillText('BOOST',20,63);

    rBox(W-203,8,195,75,10,'#1a0000');
    ctx.fillStyle='#ff4444'; ctx.font='bold 13px Arial'; ctx.textAlign='right';
    ctx.fillText(redCar.label+'  🔴',W-18,28);
    ctx.font='bold 32px Arial Black'; ctx.fillStyle='#fff'; ctx.textAlign='right';
    ctx.fillText(scores.red+' pt'+(scores.red!==1?'s':''),W-22,60);
    // boost bar red
    ctx.fillStyle='#322'; ctx.fillRect(W-178,66,160,7);
    const rf=redCar.boostFuel/5;
    const rg=ctx.createLinearGradient(W-178,0,W-18,0);
    rg.addColorStop(0,'#ff0'); rg.addColorStop(0.5,'#0f0'); rg.addColorStop(1,'#0cf');
    ctx.fillStyle=rg; ctx.fillRect(W-178,66,160*rf,7);
    ctx.strokeStyle='#644'; ctx.lineWidth=1; ctx.strokeRect(W-178,66,160,7);
    ctx.font='9px Arial'; ctx.fillStyle='#aaa'; ctx.textAlign='right'; ctx.fillText('BOOST',W-20,63);
    ctx.textAlign='left';

    rBox(W/2-90,8,180,42,10,'#0a0a22');
    ctx.fillStyle='#ccccff'; ctx.font='bold 18px Arial'; ctx.textAlign='center';
    ctx.fillText('Manche  '+round+' / '+TOTAL_ROUNDS,W/2,34);
    ctx.textAlign='left';
}

// ════════════════════════════════════════════════════════════
//  OVERLAYS
// ════════════════════════════════════════════════════════════
function drawCountdown(text,color){
    ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.font='bold 130px Arial Black';
    ctx.shadowColor=color; ctx.shadowBlur=40; ctx.fillStyle=color;
    ctx.fillText(text,W/2,H/2+50); ctx.shadowBlur=0; ctx.textAlign='left';
}
function drawRoundBanner(){
    if (!roundWinner) return;
    const color=roundWinner==='blue'?'#3399ff':'#ff3333';
    const name =roundWinner==='blue'?'Bleue':'Rouge';
    rBox(W/2-220,H/2-40,440,80,16,'#000',0.65);
    ctx.textAlign='center'; ctx.font='bold 34px Arial Black'; ctx.fillStyle=color;
    ctx.fillText('🏁  Voiture '+name+' gagne !',W/2,H/2+10); ctx.textAlign='left';
}

// confetti
let stars=[];
function spawnStars(){
    stars=[];
    for(let i=0;i<80;i++){
        const a=Math.random()*Math.PI*2,sp=Math.random()*6+2;
        stars.push({x:W/2,y:H/2-40,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,
            size:Math.random()*7+2,color:`hsl(${Math.random()*360|0},100%,65%)`,
            life:1,decay:Math.random()*0.007+0.003,gravity:0.12});
    }
}
function updateStars(){
    for(const s of stars){
        s.x+=s.vx;s.y+=s.vy;s.vy+=s.gravity;s.life-=s.decay;
        if(s.life<=0){
            const a=Math.random()*Math.PI*2,sp=Math.random()*6+2;
            s.x=W/2;s.y=H/2-60;s.vx=Math.cos(a)*sp;s.vy=Math.sin(a)*sp-2;
            s.life=1;s.color=`hsl(${Math.random()*360|0},100%,65%)`;
        }
        ctx.globalAlpha=Math.max(0,s.life);
        ctx.fillStyle=s.color; ctx.beginPath();
        ctx.arc(s.x,s.y,s.size*s.life,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
}

// trophy
let trophyBob=0,trophyScale=0;
function drawTrophy(winner){
    trophyScale=Math.min(trophyScale+0.025,1); trophyBob+=0.04;
    const bob=Math.sin(trophyBob)*8;
    const col=winner==='blue'?'#3399ff':winner==='red'?'#ff3333':'#ffdd00';
    const name=winner==='blue'?'Bleue':winner==='red'?'Rouge':'Égalité';
    ctx.save(); ctx.translate(W/2,H/2-80+bob); ctx.scale(trophyScale,trophyScale);
    ctx.font='110px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🏆',0,0); ctx.restore(); ctx.textBaseline='alphabetic';
    ctx.textAlign='center'; ctx.font='bold 46px Arial Black';
    ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=25;
    ctx.fillText(winner==='draw'?'Égalité !':'Voiture '+name+' gagne ! 🎉',W/2,H/2+80);
    ctx.shadowBlur=0; ctx.font='22px Arial'; ctx.fillStyle='#eee';
    ctx.fillText('Score final  :  🔵 '+scores.blue+'  —  🔴 '+scores.red,W/2,H/2+120);
    ctx.textAlign='left';
}

// restart button
const BTN={x:W/2-115,y:H/2+148,w:230,h:52};
function drawRestartBtn(){
    const g=ctx.createLinearGradient(BTN.x,BTN.y,BTN.x,BTN.y+BTN.h);
    g.addColorStop(0,'#00dd77'); g.addColorStop(1,'#009944');
    ctx.fillStyle=g; ctx.shadowColor='#00ff88'; ctx.shadowBlur=18;
    ctx.beginPath(); ctx.roundRect(BTN.x,BTN.y,BTN.w,BTN.h,14); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle='white'; ctx.font='bold 22px Arial Black';
    ctx.textAlign='center'; ctx.fillText('▶  Recommencer',W/2,BTN.y+34);
    ctx.textAlign='left';
}
canvas.addEventListener('click',e=>{
    if(gameState!=='gameOver'||!showRestart) return;
    const r=canvas.getBoundingClientRect();
    const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
    if(mx>=BTN.x&&mx<=BTN.x+BTN.w&&my>=BTN.y&&my<=BTN.y+BTN.h) restartGame();
});
canvas.addEventListener('mousemove',e=>{
    if(gameState!=='gameOver'||!showRestart){canvas.style.cursor='default';return;}
    const r=canvas.getBoundingClientRect();
    const mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
    canvas.style.cursor=(mx>=BTN.x&&mx<=BTN.x+BTN.w&&my>=BTN.y&&my<=BTN.y+BTN.h)
        ?'pointer':'default';
});

// ════════════════════════════════════════════════════════════
//  GAME STATE
// ════════════════════════════════════════════════════════════
const TOTAL_ROUNDS=10;
let round=1,scores={blue:0,red:0},gameState='countdown';
let countdown=3,cdTimer=0,roundWinner=null,reTimer=0;
let goTimer=0,goShowing=false,gameOverTimer=0,showRestart=false;

function startRound(){
    blueCar.reset(); redCar.reset(); roundWinner=null;
    gameState='countdown'; countdown=3; cdTimer=0; goShowing=false; goTimer=0;
}
function restartGame(){
    scores={blue:0,red:0}; round=1; showRestart=false;
    trophyScale=0; trophyBob=0; stars=[]; canvas.style.cursor='default';
    startRound();
}

// ════════════════════════════════════════════════════════════
//  MAIN LOOP
// ════════════════════════════════════════════════════════════
let lastTime=0;
function loop(ts){
    const dt=Math.min((ts-lastTime)/1000,0.1); lastTime=ts;
    drawTrack();

    if (gameState==='countdown'){
        blueCar.draw(); redCar.draw(); drawHUD();
        if (!goShowing){
            cdTimer+=dt; if(cdTimer>=1){cdTimer=0;countdown--;}
            if(countdown<=0){goShowing=true;goTimer=0;}
            else{const cs=['#ff4444','#ffaa00','#ffff00'];drawCountdown(String(countdown),cs[countdown-1]);}
        } else {
            goTimer+=dt; drawCountdown('PARTEZ !','#00ff88');
            if(goTimer>=0.75) gameState='racing';
        }
    } else if (gameState==='racing'){
        blueCar.update(); redCar.update();
        const bF=blueCar.crossedFinish(),rF=redCar.crossedFinish();
        if(bF&&!roundWinner){roundWinner='blue';scores.blue++;}
        if(rF&&!roundWinner){roundWinner='red'; scores.red++; }
        if(roundWinner){gameState='roundEnd';reTimer=0;}
        blueCar.drawTrail(); redCar.drawTrail();
        blueCar.draw(); redCar.draw(); drawHUD();
    } else if (gameState==='roundEnd'){
        blueCar.drawTrail(); redCar.drawTrail();
        blueCar.draw(); redCar.draw(); drawHUD(); drawRoundBanner();
        reTimer+=dt;
        if(reTimer>=2.2){
            if(round>=TOTAL_ROUNDS){gameState='gameOver';gameOverTimer=0;showRestart=false;spawnStars();}
            else{round++;startRound();}
        }
    } else if (gameState==='gameOver'){
        gameOverTimer+=dt;
        ctx.fillStyle='rgba(0,0,0,0.78)'; ctx.fillRect(0,0,W,H);
        updateStars();
        const winner=scores.blue>scores.red?'blue':scores.red>scores.blue?'red':'draw';
        drawTrophy(winner);
        if(gameOverTimer>=3&&!showRestart) showRestart=true;
        if(showRestart) drawRestartBtn();
    }
    requestAnimationFrame(loop);
}

startRound();
requestAnimationFrame(loop);
</script>
